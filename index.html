// Convert literal escaped newlines (backslash-n / backslash-r) from CSV into real newlines
function normalizeNewlines(text) {
  return text
    .replace(/\\r\\n|\\n|\\r/g, '\n')
    .replace(/\n{3,}/g, '\n\n');
}

function cleanText(text) {
  return text
    .replace(/\\r\\n|\\n|\\r/g, ' ')
    .replace(/https?:\/\/t\.co\/\S+/g, '')
    .replace(/\s+/g, ' ')
    .trim();
}

function formatDate(dateStr) {
  if (!dateStr) return '';
  try {
    const d = new Date(dateStr);
    if (isNaN(d)) return dateStr;
    const months = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
    return `${months[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
  } catch { return dateStr; }
}

function getFirstImage(urls) {
  if (!urls) return null;
  return urls.split(',')[0].trim() || null;
}

function getImageUrls(urls) {
  if (!urls) return [];
  return [...new Set(urls.split(',').map(url => url.trim()).filter(Boolean))];
}

function highResMediaUrl(url, original = false) {
  if (!url || !url.includes('pbs.twimg.com')) return url || '';
  try {
    const parsed = new URL(url);
    if (parsed.pathname.startsWith('/media/') || parsed.pathname.startsWith('/card_img/')) {
      if (!parsed.searchParams.has('format')) {
        const ext = parsed.pathname.match(/\.([a-zA-Z0-9]+)$/)?.[1];
        if (ext) parsed.searchParams.set('format', ext === 'jpeg' ? 'jpg' : ext);
      }
      parsed.searchParams.set('name', original ? 'orig' : 'large');
      return parsed.toString();
    }
  } catch {}
  return url;
}

function normalizeMediaItems(media) {
  if (!media) return [];
  const list = Array.isArray(media) ? media : [{ type: 'image', src: media }];
  return list.map(item => typeof item === 'string' ? { type: 'image', src: item } : item)
    .filter(item => item && (item.src || item.poster));
}

function getMaterialPostKey(tweet) {
  return getPersistentTweetId(tweet)
    || tweet['Tweet Url']
    || `${tweet.UserScreenName || 'unknown'}:${tweet.TweetCreatedDate || ''}:${cleanText(tweet.TweetText || '').slice(0, 80)}`;
}

function getInternalPostSource(tweet, preferredCollection) {
  if (!tweet) return null;
  const key = getMaterialPostKey(tweet);
  const candidates = [preferredCollection, tweet._source === 'home' ? HOME_TWEETS : allTweets, HOME_TWEETS, allTweets]
    .filter(Array.isArray);
  for (const collection of candidates) {
    let index = collection.indexOf(tweet);
    if (index < 0) index = collection.findIndex(candidate => getMaterialPostKey(candidate) === key);
    if (index >= 0) return { tweet: collection[index], collection, index };
  }
  return null;
}

function getTweetMaterialItems(tweet) {
  const items = [];
  const seen = new Set();

  const append = source => {
    normalizeMediaItems(source).forEach(rawItem => {
      const rawType = String(rawItem.type || '').toLowerCase();
      const type = rawType === 'video' || rawType === 'animated_gif' ? 'video' : 'image';
      const rawSrc = rawItem.src || rawItem.poster || '';
      if (!rawSrc || (type === 'video' && !rawItem.src)) return;
      const item = {
        type,
        src: type === 'image' ? highResMediaUrl(rawSrc, false) : rawItem.src,
        full: type === 'image' ? highResMediaUrl(rawSrc, true) : rawItem.src,
        poster: rawItem.poster ? highResMediaUrl(rawItem.poster, false) : ''
      };
      const key = `${item.type}:${item.full || item.src}`;
      if (seen.has(key)) return;
      seen.add(key);
      items.push(item);
    });
  };

  const appendArticle = article => {
    if (!article) return;
    if (article.cover) append([{ type: 'image', src: article.cover }]);
    append(article.media);
  };

  const structured = normalizeMediaItems(tweet._media);
  const imageUrls = getImageUrls(tweet.MediaImageUrl || '');
  const videoUrl = tweet.MediaVideoUrl || '';
  if (structured.length) {
    append(structured);
  } else if (videoUrl) {
    append([{ type: 'video', src: videoUrl, poster: imageUrls[0] || '' }]);
    if (imageUrls.length > 1) append(imageUrls.slice(1));
  } else {
    append(imageUrls);
  }

  if (tweet._quote) {
    append(tweet._quote.media);
    appendArticle(tweet._quote.article);
  }
  appendArticle(tweet._article);
  return items;
}

function buildMaterialPosts() {
  const posts = [];
  const seen = new Set();
  [...HOME_TWEETS, ...allTweets].forEach(tweet => {
    if (isTweetSuppressed(tweet)) return;
    const key = getMaterialPostKey(tweet);
    if (seen.has(key)) return;
    seen.add(key);
    const items = getTweetMaterialItems(tweet);
    if (!items.length) return;
    posts.push({
      key,
      tweet,
      items,
      date: new Date(tweet.TweetCreatedDate || 0).getTime() || 0
    });
  });
  return posts.sort((a, b) => b.date - a.date);
}

function shuffleMaterialItems(items) {
  const shuffled = [...items];
  for (let index = shuffled.length - 1; index > 0; index -= 1) {
    const target = Math.floor(Math.random() * (index + 1));
    [shuffled[index], shuffled[target]] = [shuffled[target], shuffled[index]];
  }
  return shuffled;
}

function getMaterialAlt(post, item, index) {
  const author = post.tweet.UserProfileName || post.tweet.UserScreenName || 'X 用户';
  return `${author} 帖子的${item.type === 'video' ? '视频' : '图片'} ${index + 1} / ${post.items.length}`;
}

function createMaterialMediaElement(post, item, index, className, eager = false) {
  const label = getMaterialAlt(post, item, index);
  if (item.type === 'video') {
    const video = document.createElement('video');
    video.className = className;
    video.dataset.src = item.src;
    video.dataset.viewerSrc = item.src;
    if (item.poster) {
      video.poster = item.poster;
      video.dataset.viewerPoster = highResMediaUrl(item.poster, true);
    }
    video.crossOrigin = 'anonymous';
    video.muted = true;
    video.autoplay = true;
    video.loop = true;
    video.playsInline = true;
    video.controls = false;
    video.disablePictureInPicture = true;
    video.disableRemotePlayback = true;
    video.setAttribute('webkit-playsinline', '');
    video.setAttribute('x-webkit-airplay', 'deny');
    video.setAttribute('controlslist', 'nodownload nofullscreen noremoteplayback');
    video.preload = eager ? 'metadata' : 'none';
    video.setAttribute('aria-label', label);
    return video;
  }

  const image = document.createElement('img');
  image.className = className;
  image.src = item.src;
  image.dataset.full = item.full || highResMediaUrl(item.src, true);
  image.crossOrigin = 'anonymous';
  image.alt = label;
  image.loading = eager ? 'eager' : 'lazy';
  image.decoding = 'async';
  image.draggable = false;
  return image;
}

function replaceBrokenMaterial(parent, media, item, className) {
  if (item.type === 'video' && item.poster) {
    const fallback = document.createElement('img');
    fallback.className = className;
    fallback.src = item.poster;
    fallback.alt = media.getAttribute('aria-label') || '视频封面';
    fallback.draggable = false;
    fallback.addEventListener('error', () => {
      fallback.replaceWith(createMaterialError());
    }, { once: true });
    media.replaceWith(fallback);
    return;
  }
  media.replaceWith(createMaterialError());
}

function createMaterialError() {
  const error = document.createElement('div');
  error.className = 'material-media-error';
  error.textContent = '[MEDIA UNAVAILABLE]';
  return error;
}

function setMediaBackdrop(element, item) {
  const backdrop = item?.type === 'video' ? item.poster : (item?.full || item?.src);
  if (!element || !backdrop) return;
  element.classList.add('has-media-backdrop');
  element.style.setProperty('--media-backdrop', `url(${JSON.stringify(highResMediaUrl(backdrop, true))})`);
}

function getMaterialViewerPayload(entry) {
  return {
    items: entry.post.items.map((item, itemIndex) => ({
      type: item.type,
      src: item.full || item.src,
      poster: item.poster,
      alt: getMaterialAlt(entry.post, item, itemIndex)
    })),
    index: entry.mediaIndex,
    source: getInternalPostSource(entry.post.tweet)
  };
}

function openMaterialPost(post, index) {
  const payload = getMaterialViewerPayload({ post, mediaIndex: index });
  openLightbox(payload.items, payload.index, { source: payload.source });
}

function openMaterialGridItem(gridIndex) {
  const entry = materialGridItems[gridIndex];
  if (!entry) return;
  const payload = getMaterialViewerPayload(entry);
  openLightbox(payload.items, payload.index, {
    context: 'material-grid',
    sequenceIndex: gridIndex,
    sequenceLength: materialGridItems.length,
    source: payload.source
  });
}

function createMaterialGridItem(entry, visualIndex, materialIndex) {
  const { post, item, mediaIndex } = entry;
  const tile = document.createElement('div');
  tile.className = `material-grid-item${item.type === 'video' ? ' is-video' : ''}`;
  tile.tabIndex = 0;
  tile.setAttribute('role', 'button');
  tile.setAttribute('aria-label', `${getMaterialAlt(post, item, mediaIndex)}，全屏查看`);
  tile.style.animationDelay = `${Math.min(visualIndex, 7) * 50}ms`;

  const mediaClass = `material-grid-media${item.type === 'video' ? ' card-video' : ''}`;
  const media = createMaterialMediaElement(post, item, mediaIndex, mediaClass);
  media.addEventListener('error', () => replaceBrokenMaterial(tile, media, item, 'material-grid-media'), { once: true });
  if (item.type === 'video') {
    media.addEventListener('loadedmetadata', () => {
      if (media.videoWidth && media.videoHeight) {
        tile.style.aspectRatio = `${media.videoWidth} / ${media.videoHeight}`;
      }
    }, { once: true });
  }
  tile.appendChild(media);
  const unlikeButton = createUnlikeIconButton('material-unlike', post.tweet);
  if (unlikeButton) tile.appendChild(unlikeButton);

  const open = () => openMaterialGridItem(materialIndex);
  tile.addEventListener('click', open);
  tile.addEventListener('keydown', event => {
    if (event.key !== 'Enter' && event.key !== ' ') return;
    event.preventDefault();
    open();
  });
  return tile;
}

function renderMaterialGridBatch() {
  const grid = document.getElementById('materialGrid');
  const state = document.getElementById('materialGridState');
  if (!grid || mediaMode !== 'grid') return;
  if (!materialGridItems.length) {
    state.textContent = '[NO MEDIA]';
    return;
  }
  if (materialGridRendered >= materialGridItems.length) {
    state.textContent = '[END OF MEDIA]';
    return;
  }

  const start = materialGridRendered;
  const end = Math.min(start + MATERIAL_GRID_BATCH, materialGridItems.length);
  const fragment = document.createDocumentFragment();
  for (let index = start; index < end; index += 1) {
    fragment.appendChild(createMaterialGridItem(materialGridItems[index], index - start, index));
  }
  grid.appendChild(fragment);
  materialGridRendered = end;
  prepareCardVideo(grid);
  state.textContent = materialGridRendered < materialGridItems.length ? '[SCROLL FOR MORE]' : '[END OF MEDIA]';
}

function ensureImmersiveVideo(video) {
  if (!video || video.src || !video.dataset.src) return;
  video.src = video.dataset.src;
  video.load();
}

function syncImmersivePost(postElement) {
  if (!postElement) return;
  const track = postElement.querySelector('.media-immersive-track');
  const slides = [...postElement.querySelectorAll('.media-immersive-slide')];
  const current = Math.max(0, Math.min(
    Math.round(track.scrollLeft / Math.max(track.clientWidth, 1)),
    slides.length - 1
  ));
  postElement.dataset.mediaIndex = String(current);
  postElement.querySelectorAll('.media-immersive-dot').forEach((dot, index) => {
    dot.classList.toggle('active', index === current);
    dot.setAttribute('aria-current', index === current ? 'true' : 'false');
  });

  const shouldPlay = postElement.dataset.active === 'true'
    && activeTab === 'media'
    && mediaMode === 'immersive'
    && !document.hidden;
  const activeVideo = slides[current]?.querySelector('.immersive-video') || null;
  postElement.querySelectorAll('.immersive-video').forEach(video => {
    if (shouldPlay && video === activeVideo) {
      ensureImmersiveVideo(video);
      video.muted = true;
      video.play().catch(() => {});
    } else {
      video.pause();
    }
  });
}

function syncImmersivePlayback() {
  document.querySelectorAll('#mediaImmersiveFeed .media-immersive-post').forEach(syncImmersivePost);
}

function createImmersivePost(post, postIndex) {
  const article = document.createElement('article');
  article.className = 'media-immersive-post';
  article.dataset.postIndex = String(postIndex);
  article.dataset.active = 'false';
  article.dataset.mediaIndex = '0';

  const track = document.createElement('div');
  track.className = 'media-immersive-track';
  let startX = 0;
  let startY = 0;
  let suppressClick = false;
  let scrollFrame = 0;

  track.addEventListener('pointerdown', event => {
    startX = event.clientX;
    startY = event.clientY;
    suppressClick = false;
  });
  track.addEventListener('pointermove', event => {
    const dx = Math.abs(event.clientX - startX);
    const dy = Math.abs(event.clientY - startY);
    if (dx > 8 && dx > dy) suppressClick = true;
  });
  track.addEventListener('pointerup', () => {
    window.setTimeout(() => { suppressClick = false; }, 0);
  });
  track.addEventListener('scroll', () => {
    if (scrollFrame) return;
    scrollFrame = requestAnimationFrame(() => {
      scrollFrame = 0;
      syncImmersivePost(article);
    });
  }, { passive: true });

  post.items.forEach((item, mediaIndex) => {
    const slide = document.createElement('div');
    slide.className = 'media-immersive-slide';
    slide.tabIndex = 0;
    slide.setAttribute('role', 'button');
    slide.setAttribute('aria-label', `${getMaterialAlt(post, item, mediaIndex)}，全屏查看`);
    setMediaBackdrop(slide, item);
    const mediaClass = `media-immersive-media${item.type === 'video' ? ' immersive-video' : ''}`;
    const media = createMaterialMediaElement(post, item, mediaIndex, mediaClass, postIndex < 2);
    media.addEventListener('error', () => replaceBrokenMaterial(slide, media, item, 'media-immersive-media'), { once: true });
    slide.appendChild(media);
    slide.addEventListener('click', event => {
      if (suppressClick) {
        event.preventDefault();
        return;
      }
      openMaterialPost(post, mediaIndex);
    });
    slide.addEventListener('keydown', event => {
      if (event.key !== 'Enter' && event.key !== ' ') return;
      event.preventDefault();
      openMaterialPost(post, mediaIndex);
    });
    track.appendChild(slide);
  });
  article.appendChild(track);
  const unlikeButton = createUnlikeIconButton('material-unlike', post.tweet);
  if (unlikeButton) article.appendChild(unlikeButton);

  const dots = document.createElement('div');
  dots.className = `media-immersive-dots${post.items.length <= 1 ? ' single' : ''}`;
  post.items.forEach((_, mediaIndex) => {
    const dot = document.createElement('button');
    dot.className = `media-immersive-dot${mediaIndex === 0 ? ' active' : ''}`;
    dot.type = 'button';
    dot.setAttribute('aria-label', `查看第 ${mediaIndex + 1} 项素材`);
    dot.setAttribute('aria-current', mediaIndex === 0 ? 'true' : 'false');
    dot.addEventListener('click', event => {
      event.stopPropagation();
      track.scrollTo({
        left: track.clientWidth * mediaIndex,
        behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'
      });
    });
    dots.appendChild(dot);
  });
  article.appendChild(dots);
  return article;
}

function setupImmersiveObserver() {
  if (immersivePostObserver) immersivePostObserver.disconnect();
  const feed = document.getElementById('mediaImmersiveFeed');
  if (!feed || mediaMode !== 'immersive') return;
  if (!('IntersectionObserver' in window)) {
    const first = feed.querySelector('.media-immersive-post');
    if (first) {
      first.dataset.active = 'true';
      syncImmersivePost(first);
    }
    return;
  }
  immersivePostObserver = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      const active = entry.isIntersecting && entry.intersectionRatio >= 0.72;
      entry.target.dataset.active = active ? 'true' : 'false';
      syncImmersivePost(entry.target);
      const index = Number(entry.target.dataset.postIndex || 0);
      if (entry.isIntersecting && index >= materialImmersiveRendered - 4) {
        renderMaterialImmersiveBatch();
      }
    });
  }, { root: feed, threshold: [0, 0.15, 0.72, 1] });
  feed.querySelectorAll('.media-immersive-post').forEach(post => immersivePostObserver.observe(post));
}

function renderMaterialImmersiveBatch() {
  const feed = document.getElementById('mediaImmersiveFeed');
  if (!feed || mediaMode !== 'immersive') return;
  if (!materialPosts.length) {
    feed.innerHTML = '<div class="empty-state"><div class="label">[NO MEDIA]</div></div>';
    return;
  }
  if (materialImmersiveRendered >= materialPosts.length) return;
  const start = materialImmersiveRendered;
  const end = Math.min(start + MATERIAL_IMMERSIVE_BATCH, materialPosts.length);
  const fragment = document.createDocumentFragment();
  for (let index = start; index < end; index += 1) {
    fragment.appendChild(createImmersivePost(materialPosts[index], index));
  }
  feed.appendChild(fragment);
  materialImmersiveRendered = end;
  setupImmersiveObserver();
}

function pauseMaterialBrowser() {
  document.querySelectorAll('#mediaView video').forEach(video => video.pause());
  if (immersivePostObserver) {
    immersivePostObserver.disconnect();
    immersivePostObserver = null;
  }
}

function initializeMaterialBrowser() {
  const grid = document.getElementById('materialGrid');
  const feed = document.getElementById('mediaImmersiveFeed');
  cleanupCardVideos(grid);
  pauseMaterialBrowser();
  grid.replaceChildren();
  feed.replaceChildren();

  materialPosts = buildMaterialPosts();
  materialGridItems = shuffleMaterialItems(materialPosts.flatMap(post =>
    post.items.map((item, mediaIndex) => ({ post, item, mediaIndex }))
  ));
  materialGridRendered = 0;
  materialImmersiveRendered = 0;
  materialBrowserSignature = `${allTweets.length}:${materialPosts.length}:${materialGridItems.length}`;
  materialBrowserReady = true;
}

function setMediaMode(mode) {
  if (!['grid', 'immersive'].includes(mode)) mode = 'grid';
  pauseMaterialBrowser();
  mediaMode = mode;
  document.querySelectorAll('.media-mode-button').forEach(button => {
    const active = button.dataset.mediaMode === mode;
    button.classList.toggle('active', active);
    button.setAttribute('aria-selected', active ? 'true' : 'false');
  });
  document.querySelectorAll('.media-mode-panel').forEach(panel => {
    panel.classList.toggle('active', panel.dataset.mediaPanel === mode);
  });
  if (mode === 'grid') {
    if (materialGridRendered === 0) renderMaterialGridBatch();
    else prepareCardVideo(document.getElementById('materialGrid'));
  } else {
    if (materialImmersiveRendered === 0) renderMaterialImmersiveBatch();
    else setupImmersiveObserver();
    requestAnimationFrame(syncImmersivePlayback);
  }
}

function getAdjacentMediaMode(direction) {
  const modes = ['grid', 'immersive'];
  const index = modes.indexOf(mediaMode);
  const next = index + direction;
  return next >= 0 && next < modes.length ? modes[next] : '';
}

function switchMediaModeByGesture(direction) {
  const nextMode = getAdjacentMediaMode(direction);
  if (!nextMode) return false;
  const view = document.getElementById('mediaView');
  window.clearTimeout(mediaModeTransitionTimer);
  view.dataset.modeTransition = direction > 0 ? 'forward' : 'backward';
  setMediaMode(nextMode);
  mediaModeTransitionTimer = window.setTimeout(() => {
    delete view.dataset.modeTransition;
  }, matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 200);
  return true;
}

function resetMediaModeGesture() {
  const modeSwitch = document.querySelector('.media-mode-switch');
  modeSwitch?.classList.remove('dragging');
  modeSwitch?.style.setProperty('--mode-drag-x', '0px');
  mediaModeGesture.pointerId = null;
  mediaModeGesture.dx = 0;
  mediaModeGesture.dy = 0;
  mediaModeGesture.axis = null;
}

function onMediaModePointerDown(event) {
  if (activeTab !== 'media' || event.button !== 0) return;
  mediaModeGesture.pointerId = event.pointerId;
  mediaModeGesture.startX = event.clientX;
  mediaModeGesture.startY = event.clientY;
  mediaModeGesture.dx = 0;
  mediaModeGesture.dy = 0;
  mediaModeGesture.axis = null;
}

function onMediaModePointerMove(event) {
  if (event.pointerId !== mediaModeGesture.pointerId) return;
  mediaModeGesture.dx = event.clientX - mediaModeGesture.startX;
  mediaModeGesture.dy = event.clientY - mediaModeGesture.startY;
  const absX = Math.abs(mediaModeGesture.dx);
  const absY = Math.abs(mediaModeGesture.dy);
  if (!mediaModeGesture.axis && Math.max(absX, absY) > 8) {
    mediaModeGesture.axis = absX > absY * 1.15 ? 'x' : 'y';
  }
  if (mediaModeGesture.axis !== 'x') return;
  if (!event.currentTarget.hasPointerCapture(event.pointerId)) {
    event.currentTarget.setPointerCapture(event.pointerId);
  }
  const direction = mediaModeGesture.dx < 0 ? 1 : -1;
  const available = Boolean(getAdjacentMediaMode(direction));
  const resisted = Math.max(-12, Math.min(12, mediaModeGesture.dx * (available ? 0.12 : 0.04)));
  const modeSwitch = document.querySelector('.media-mode-switch');
  modeSwitch?.classList.add('dragging');
  modeSwitch?.style.setProperty('--mode-drag-x', `${resisted}px`);
  event.preventDefault();
}

function onMediaModePointerEnd(event) {
  if (event.pointerId !== mediaModeGesture.pointerId) return;
  if (event.currentTarget.hasPointerCapture(event.pointerId)) {
    event.currentTarget.releasePointerCapture(event.pointerId);
  }
  const horizontal = mediaModeGesture.axis === 'x';
  const direction = mediaModeGesture.dx < 0 ? 1 : -1;
  const shouldSwitch = horizontal
    && Math.abs(mediaModeGesture.dx) >= 36
    && Math.abs(mediaModeGesture.dx) > Math.abs(mediaModeGesture.dy) * 1.15;
  if (shouldSwitch && switchMediaModeByGesture(direction)) {
    suppressNextMediaModeClick = true;
    window.setTimeout(() => { suppressNextMediaModeClick = false; }, 240);
  }
  resetMediaModeGesture();
}

function onMediaModeWheel(event) {
  if (activeTab !== 'media' || Math.abs(event.deltaX) <= Math.abs(event.deltaY) * 1.1) return;
  const direction = event.deltaX > 0 ? 1 : -1;
  if (!getAdjacentMediaMode(direction)) return;
  event.preventDefault();
  if (Date.now() < mediaModeWheelCooldownUntil) return;
  mediaModeWheelX += event.deltaX;
  window.clearTimeout(mediaModeWheelTimer);
  mediaModeWheelTimer = window.setTimeout(() => { mediaModeWheelX = 0; }, 160);
  if (Math.abs(mediaModeWheelX) < 64) return;
  if (switchMediaModeByGesture(mediaModeWheelX > 0 ? 1 : -1)) {
    mediaModeWheelCooldownUntil = Date.now() + 520;
  }
  mediaModeWheelX = 0;
}

function renderMaterialBrowser(force = false) {
  const nextPosts = buildMaterialPosts();
  const nextItemCount = nextPosts.reduce((total, post) => total + post.items.length, 0);
  const signature = `${allTweets.length}:${nextPosts.length}:${nextItemCount}`;
  if (force || !materialBrowserReady || signature !== materialBrowserSignature) {
    initializeMaterialBrowser();
  }
  setMediaMode(mediaMode);
}

function linkifyText(text) {
  return text.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
}

function escapeHTML(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function loadTranslationCache() {
  try {
    return JSON.parse(localStorage.getItem(TRANSLATIONS_KEY) || '{}');
  } catch {
    return {};
  }
}

function saveTranslationCache() {
  try { localStorage.setItem(TRANSLATIONS_KEY, JSON.stringify(translationCache)); } catch {}
}

function getEnrichmentKey(tweet) {
  return tweet.TweetID || tweet['Tweet Url'] || `${tweet.UserScreenName}:${tweet.TweetCreatedDate}`;
}

function needsChineseTranslation(text) {
  const cjk = (text.match(/[\u3400-\u9fff]/g) || []).length;
  const latin = (text.match(/[A-Za-z]/g) || []).length;
  return cjk < 8 && latin > 12;
}

function normalizedMeaning(text) {
  return (text || '').toLowerCase().replace(/[\s\p{P}\p{S}]+/gu, '');
}

function summariesAreRedundant(summary, translation) {
  const a = normalizedMeaning(summary);
  const b = normalizedMeaning(translation);
  if (!a || !b) return false;
  if (a === b) return true;
  const shorter = Math.min(a.length, b.length);
  const longer = Math.max(a.length, b.length);
  return shorter / Math.max(longer, 1) > 0.82 && (a.includes(b) || b.includes(a));
}

function summarizeText(text) {
  const cleaned = cleanText(text || '')
    .replace(/https?:\/\/\S+/g, '')
    .replace(/(^|\s)@[\w_]+/g, ' ')
    .replace(/^[\s\-–—•·]+/, '')
    .replace(/\s+/g, ' ')
    .trim();
  if (!cleaned) return '媒体帖：重点信息在图片或视频中，可打开原帖查看上下文。';
  if (cleaned.length <= 34) return '原帖较短，核心信息已完整呈现在原文或翻译中。';

  const clauses = cleaned
    .split(/(?<=[。！？!?；;])\s*|\n+|(?<=[，,：:])\s+/)
    .map(part => part.trim())
    .filter(part => part.length >= 8 && !/^(点击|查看|了解更多|read more|learn more)/i.test(part));
  const keywords = /AI|模型|设计|产品|工具|功能|发布|上线|支持|开源|安全|研究|更新|效率|体验|工作流|agent|model|design|product|launch|release|security|research|workflow/i;
  const ranked = clauses.map((clause, index) => ({
    clause,
    score: (keywords.test(clause) ? 5 : 0) + Math.min(clause.length, 72) / 24 - index * 0.35
  })).sort((a, b) => b.score - a.score);

  let core = (ranked[0]?.clause || cleaned)
    .replace(/^(今天|现在|我们很高兴(?:地)?宣布|很高兴(?:地)?宣布|全新|新的|终于)[，,:：\s]*/i, '')
    .trim();
  if (core.length > 64) core = `${core.slice(0, 61).trimEnd()}…`;
  if (normalizedMeaning(core).length / Math.max(normalizedMeaning(cleaned).length, 1) > 0.78) {
    core = `${core.slice(0, Math.max(28, Math.round(core.length * 0.55))).trimEnd()}…`;
  }

  let prefix = '核心内容：';
  if (/设计|界面|视觉|UI|UX|design/i.test(cleaned)) prefix = '设计要点：';
  else if (/安全|漏洞|攻击|security|cyber/i.test(cleaned)) prefix = '安全动态：';
  else if (/发布|上线|新增|更新|推出|launch|release|new in/i.test(cleaned)) prefix = '产品更新：';
  else if (/AI|模型|agent|Claude|Gemini|GPT/i.test(cleaned)) prefix = 'AI 动态：';
  return `${prefix}${core}`;
}

function getDistinctSummary(tweet, basis) {
  const supplied = cleanText(tweet.Summary || '');
  if (supplied && !summariesAreRedundant(supplied, basis)) return supplied;
  const generated = summarizeText(basis);
  return summariesAreRedundant(generated, basis)
    ? '核心信息已提炼在上方；原帖较短，不重复展示整段翻译。'
    : generated;
}

async function translateToChinese(text) {
  const params = new URLSearchParams({ client: 'gtx', sl: 'auto', tl: 'zh-CN', dt: 't', q: text.slice(0, 1800) });
  const response = await fetch(`https://translate.googleapis.com/translate_a/single?${params}`, {
    referrerPolicy: 'no-referrer'
  });
  if (!response.ok) throw new Error(`Translation ${response.status}`);
  const data = await response.json();
  return (data[0] || []).map(part => part[0] || '').join('').trim();
}

function applyCardEnrichment(card, translation, summary, state = 'ready') {
  const insight = card.querySelector('.card-insight');
  if (!insight) return;
  insight.dataset.state = state;
  const translationEl = insight.querySelector('.translation-text');
  const summaryEl = insight.querySelector('.summary-text');
  if (translationEl && translation) translationEl.textContent = translation;
  if (summaryEl && summary) summaryEl.textContent = summary;
}

async function hydrateCardEnrichment(card, tweet) {
  const original = cleanText(tweet.TweetText || '');
  const key = getEnrichmentKey(tweet);
  const cached = translationCache[key];
  if (cached) {
    const summary = summariesAreRedundant(cached.summary, cached.translation || original)
      ? getDistinctSummary(tweet, cached.translation || original)
      : cached.summary;
    applyCardEnrichment(card, cached.translation, summary);
    return;
  }

  if (!needsChineseTranslation(original)) {
    const summary = getDistinctSummary(tweet, original);
    applyCardEnrichment(card, '', summary);
    return;
  }

  try {
    const translation = tweet.Translation || await translateToChinese(original);
    const summary = getDistinctSummary(tweet, translation);
    tweet.Translation = translation;
    tweet.Summary = summary;
    translationCache[key] = { translation, summary };
    saveTranslationCache();
    if (card.isConnected) applyCardEnrichment(card, translation, summary);
  } catch {
    if (card.isConnected) {
      applyCardEnrichment(card, '翻译服务暂时不可用，滚动离开后返回可重试。', getDistinctSummary(tweet, original), 'error');
    }
  }
}

const cardEnrichmentObserver = 'IntersectionObserver' in window
  ? new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (!entry.isIntersecting) return;
        const card = entry.target;
        cardEnrichmentObserver.unobserve(card);
        hydrateCardEnrichment(card, card._tweet);
      });
    }, { rootMargin: '320px 0px' })
  : null;

function prepareCardEnrichment(card, tweet) {
  card._tweet = tweet;
  const key = getEnrichmentKey(tweet);
  if (translationCache[key] || !needsChineseTranslation(tweet.TweetText || '')) {
    hydrateCardEnrichment(card, tweet);
  } else if (cardEnrichmentObserver) {
    cardEnrichmentObserver.observe(card);
  } else {
    hydrateCardEnrichment(card, tweet);
  }
}

function renderMediaTrack(media, variant = 'digest') {
  const items = normalizeMediaItems(media);
  if (!items.length) return '';
  const shellClass = variant === 'digest' ? 'digest-media-shell' : 'embedded-post-media';
  const trackClass = variant === 'digest' ? 'digest-media-track' : '';
  const contents = items.map((item, index) => {
    if (item.type === 'video' && item.src) {
      const poster = highResMediaUrl(item.poster || '', false);
      const video = `<video class="card-video" data-src="${escapeHTML(item.src)}" data-viewer-src="${escapeHTML(item.src)}"${poster ? ` poster="${escapeHTML(poster)}" data-viewer-poster="${escapeHTML(highResMediaUrl(item.poster || '', true))}"` : ''} crossorigin="anonymous" muted autoplay loop playsinline preload="none" aria-label="视频 ${index + 1} / ${items.length}"></video>`;
      return variant === 'digest' ? `<div class="media-backdrop-slide">${video}</div>` : video;
    }
    const display = highResMediaUrl(item.src || item.poster, false);
    const full = highResMediaUrl(item.src || item.poster, true);
    const image = `<img src="${escapeHTML(display)}" data-full="${escapeHTML(full)}" crossorigin="anonymous" alt="" loading="lazy">`;
    return variant === 'digest' ? `<div class="media-backdrop-slide">${image}</div>` : image;
  }).join('');
  return `<div class="${shellClass}">${trackClass ? `<div class="${trackClass}">${contents}</div>` : contents}${items.length > 1 ? `<span class="media-count">1 / ${items.length}</span>` : ''}</div>`;
}

function renderArticle(article) {
  if (!article) return '';
  const fullText = normalizeNewlines(article.fullText || '').replace(/https?:\/\/t\.co\/\S+/g, '').trim();
  const preview = cleanText(article.preview || '');
  const hasFullText = fullText && normalizedMeaning(fullText) !== normalizedMeaning(preview);
  const body = fullText || preview;
  const media = normalizeMediaItems(article.media);
  const inlineMedia = media.length ? `<div class="x-article-inline-media">${media.map((item, index) => {
    if (item.type === 'video' && item.src) {
      return `<video class="card-video" data-src="${escapeHTML(item.src)}" data-viewer-src="${escapeHTML(item.src)}"${item.poster ? ` poster="${escapeHTML(highResMediaUrl(item.poster))}" data-viewer-poster="${escapeHTML(highResMediaUrl(item.poster, true))}"` : ''} crossorigin="anonymous" muted autoplay loop playsinline preload="none" aria-label="文章内视频 ${index + 1}"></video>`;
    }
    const display = highResMediaUrl(item.src, false);
    const full = highResMediaUrl(item.src, true);
    return `<img src="${escapeHTML(display)}" data-full="${escapeHTML(full)}" crossorigin="anonymous" alt="" loading="lazy">`;
  }).join('')}</div>` : '';
  const action = hasFullText ? '展开阅读全文 ↓' : '展开长文预览 ↓';
  return `<details class="x-article">
    ${article.cover ? `<img class="x-article-cover" src="${escapeHTML(highResMediaUrl(article.cover))}" data-full="${escapeHTML(highResMediaUrl(article.cover, true))}" crossorigin="anonymous" alt="" loading="lazy">` : ''}
    <summary class="x-article-summary">
      <span class="x-article-eyebrow">${article.kind === 'x' ? 'X ARTICLE' : 'ARTICLE'}</span>
      <strong class="x-article-title">${escapeHTML(article.title || '长文')}</strong>
      ${preview ? `<span class="x-article-preview">${escapeHTML(preview)}</span>` : ''}
      <span class="x-article-action">${action}</span>
    </summary>
    <div class="x-article-body">${escapeHTML(body || '暂无可用预览，请打开原文阅读。')}${inlineMedia}${article.url ? `<a class="x-article-original" href="${escapeHTML(article.url)}" target="_blank" rel="noopener">在原站阅读全文 →</a>` : ''}</div>
  </details>`;
}

function renderEmbeddedPost(post) {
  if (!post) return '';
  return `<aside class="embedded-post">
    <div class="embedded-post-head">
      ${post.avatar ? `<img class="embedded-post-avatar" src="${escapeHTML(post.avatar)}" crossorigin="anonymous" alt="" loading="lazy">` : ''}
      <div><div class="embedded-post-author">${escapeHTML(post.author || '原作者')}</div><div class="embedded-post-handle">${post.handle ? `@${escapeHTML(post.handle)}` : ''}</div></div>
      <span class="embedded-post-label">${escapeHTML(post.label || '引用原帖')}</span>
    </div>
    ${post.text ? `<div class="embedded-post-text">${escapeHTML(normalizeNewlines(post.text).replace(/https?:\/\/t\.co\/\S+/g, '').trim())}</div>` : ''}
    ${renderMediaTrack(post.media, 'embedded')}
    ${renderArticle(post.article)}
    ${post.url ? `<a class="x-article-original" href="${escapeHTML(post.url)}" target="_blank" rel="noopener">打开原帖 →</a>` : ''}
  </aside>`;
}

function wireRichMedia(container, source = null) {
  prepareCardVideo(container);
  container.querySelectorAll('.media-backdrop-slide').forEach(slide => {
    const media = slide.querySelector('img, video');
    if (!media) return;
    setMediaBackdrop(slide, {
      type: media.tagName === 'VIDEO' ? 'video' : 'image',
      src: media.dataset.full || media.currentSrc || media.src || '',
      full: media.dataset.full || '',
      poster: media.dataset.viewerPoster || media.poster || ''
    });
  });
  container.querySelectorAll('img[data-full], video[data-viewer-src], video.card-video[data-src], #modalVideo').forEach(media => {
    if (media.classList.contains('card-video-fallback') || media.dataset.viewerWired === 'true') return;
    media.dataset.viewerWired = 'true';
    media.classList.add('viewer-launch');
    media.tabIndex = 0;
    media.setAttribute('role', 'button');
    media.setAttribute('aria-label', media.tagName === 'VIDEO' ? '全屏查看视频' : '全屏查看图片');
    const launchViewer = event => {
      event.preventDefault();
      event.stopPropagation();
      const { items, index } = getViewerCollection(media);
      openLightbox(items, index, { source });
    };
    media.addEventListener('click', launchViewer);
    media.addEventListener('keydown', event => {
      if (event.key !== 'Enter' && event.key !== ' ') return;
      launchViewer(event);
    });
  });
  container.querySelectorAll('.digest-media-track, .embedded-post-media').forEach(track => {
    const shell = track.closest('.digest-media-shell, .embedded-post');
    const count = shell?.querySelector('.media-count');
    if (!count) return;
    const total = track.children.length;
    track.addEventListener('scroll', () => {
      const current = Math.round(track.scrollLeft / Math.max(track.clientWidth, 1)) + 1;
      count.textContent = `${Math.min(current, total)} / ${total}`;
    }, { passive: true });
  });
}

function renderHomeFeed() {
  const container = document.getElementById('homeFeed');
  const groups = new Map();
  const visibleHomeTweets = HOME_TWEETS.filter(tweet => !isTweetSuppressed(tweet));
  const dateKey = value => {
    const parts = new Intl.DateTimeFormat('en', {
      timeZone: 'Asia/Shanghai', year: 'numeric', month: '2-digit', day: '2-digit'
    }).formatToParts(new Date(value));
    const get = type => parts.find(part => part.type === type)?.value || '';
    return `${get('year')}-${get('month')}-${get('day')}`;
  };

  visibleHomeTweets.forEach((tweet, index) => {
    const key = dateKey(tweet.TweetCreatedDate);
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push({ tweet, index });
  });

  const today = dateKey(new Date());
  const yesterday = dateKey(new Date(Date.now() - 86400000));
  const columnCount = getHomeColumnCount();
  _currentHomeColumnCount = columnCount;
  container.replaceChildren();

  groups.forEach((entries, date) => {
    const calendarLabel = new Intl.DateTimeFormat('zh-CN', { month: 'long', day: 'numeric' })
      .format(new Date(`${date}T12:00:00+08:00`));
    const label = date === today ? '今天' : (date === yesterday ? '昨天' : calendarLabel);
    const section = document.createElement('section');
    section.className = 'home-date-group';
    section.innerHTML = `<div class="home-date-heading"><span class="date">${label} · ${date}</span><span>${entries.length} ITEMS</span></div>`;

    const grid = document.createElement('div');
    grid.className = 'digest-grid masonry';
    for (let columnIndex = 0; columnIndex < columnCount; columnIndex += 1) {
      const column = document.createElement('div');
      column.className = 'masonry-col';
      grid.appendChild(column);
    }
    section.appendChild(grid);
    container.appendChild(section);

    entries.forEach(({ tweet, index }) => {
      const card = createCard(tweet, index, {
        collection: visibleHomeTweets,
        onOpen: () => openModalAt(index, visibleHomeTweets)
      });
      const target = getShortestColumn(grid);
      if (target) target.appendChild(card);
      else grid.appendChild(card);
      prepareCardVideo(card);
      prepareCardEnrichment(card, tweet);
    });
  });

  document.getElementById('homeItemCount').textContent = `${visibleHomeTweets.length} 条精选`;
}
// ── Card rendering ──
function createCard(tweet, index, options = {}) {
  const card = document.createElement('div');
  card.className = 'card';
  card.style.animationDelay = `${(index % BATCH_SIZE) * 30}ms`;

  const mediaType = tweet['MediaType'] || '';
  const imageUrls = getImageUrls(tweet['MediaImageUrl']).map(url => highResMediaUrl(url, false));
  const imageUrl = imageUrls[0] || '';
  const videoUrl = tweet['MediaVideoUrl'] || '';
  const displayText = cleanText(tweet['TweetText'] || '');
  const profilePicOriginal = tweet['UserProfilePic'] || '';
  const profilePic = profilePicOriginal;
  const profileName = tweet['UserProfileName'] || '';
  const screenName = tweet['UserScreenName'] || '';
  const date = formatDate(tweet['TweetCreatedDate']);
  const structuredMedia = normalizeMediaItems(tweet._media);
  const hasStructuredVideo = structuredMedia.some(item => item.type === 'video' && item.src);
  const carouselCount = structuredMedia.length || imageUrls.length;

  let html = '';

  if (structuredMedia.length) {
    html += `<div class="card-media${structuredMedia.length > 1 ? ' card-media-carousel' : ''}">
      <div class="card-media-track">
        ${structuredMedia.map((item, mediaIndex) => {
          if (item.type === 'video' && item.src) {
            const poster = highResMediaUrl(item.poster || '', false);
            return `<div class="media-backdrop-slide"><video class="card-video" data-src="${escapeHTML(item.src)}" data-viewer-src="${escapeHTML(item.src)}"${poster ? ` poster="${escapeHTML(poster)}" data-viewer-poster="${escapeHTML(highResMediaUrl(item.poster || '', true))}"` : ''} crossorigin="anonymous" muted autoplay loop playsinline preload="none" aria-label="视频 ${mediaIndex + 1} / ${structuredMedia.length}"></video></div>`;
          }
          const display = highResMediaUrl(item.src || item.poster, false);
          const full = highResMediaUrl(item.src || item.poster, true);
          return `<div class="media-backdrop-slide"><img src="${escapeHTML(display)}" data-full="${escapeHTML(full)}" crossorigin="anonymous" alt="" loading="lazy"></div>`;
        }).join('')}
      </div>
      ${structuredMedia.length > 1 ? `<span class="media-count">1 / ${structuredMedia.length}</span>` : ''}
      ${hasStructuredVideo ? '<span class="video-badge">▶ VIDEO</span>' : ''}
    </div>`;
  } else if (mediaType.toLowerCase() === 'video' && videoUrl) {
    html += `<div class="card-media">
      <video class="card-video" data-src="${escapeHTML(videoUrl)}" data-viewer-src="${escapeHTML(videoUrl)}"${imageUrl ? ` poster="${escapeHTML(imageUrl)}" data-viewer-poster="${escapeHTML(highResMediaUrl(imageUrl, true))}"` : ''} crossorigin="anonymous" muted autoplay loop playsinline preload="none" aria-label="Video preview"></video>
      ${imageUrl ? `<img class="card-video-fallback" src="${escapeHTML(imageUrl)}" crossorigin="anonymous" alt="" loading="lazy">` : ''}
      <span class="video-badge">▶ VIDEO</span>
    </div>`;
  } else if (imageUrl) {
    if (imageUrls.length > 1) {
      html += `<div class="card-media card-media-carousel">
        <div class="card-media-track">
          ${imageUrls.map(url => `<div class="media-backdrop-slide"><img src="${escapeHTML(url)}" crossorigin="anonymous" alt="" loading="lazy" data-full="${escapeHTML(highResMediaUrl(url, true))}"></div>`).join('')}
        </div>
        <span class="media-count">1 / ${imageUrls.length}</span>
      </div>`;
    } else {
      html += `<div class="card-media">
        <img src="${escapeHTML(imageUrl)}" crossorigin="anonymous" alt="" loading="lazy" data-full="${escapeHTML(highResMediaUrl(imageUrl, true))}" onerror="this.parentElement.remove()">
      </div>`;
    }
  }

  html += `<div class="card-body">`;
  html += `<div class="card-user">
    <img class="card-avatar" src="${escapeHTML(profilePic)}" data-fallback="${escapeHTML(profilePicOriginal)}" crossorigin="anonymous" alt="" loading="lazy" onerror="if(this.dataset.fallback && this.src !== this.dataset.fallback){this.src=this.dataset.fallback}else{this.style.display='none'}">
    <div class="card-user-info">
      <div class="card-name">${escapeHTML(profileName)}</div>
      <div class="card-handle">@${escapeHTML(screenName)}</div>
    </div>
  </div>`;

  if (displayText) {
    html += `<div class="card-text">${linkifyText(escapeHTML(displayText))}</div>`;
  }

  html += renderEmbeddedPost(tweet._quote);
  html += renderArticle(tweet._article);

  const enrichment = translationCache[getEnrichmentKey(tweet)] || {};
  const shouldTranslate = needsChineseTranslation(displayText);
  const translation = tweet.Translation || enrichment.translation || '';
  const cachedSummary = tweet.Summary || enrichment.summary || '';
  const summary = cachedSummary && !summariesAreRedundant(cachedSummary, translation || displayText)
    ? cachedSummary
    : (shouldTranslate && !translation ? '正在生成中文摘要…' : getDistinctSummary(tweet, translation || displayText));
  html += `<div class="card-insight" data-state="${shouldTranslate && !translation ? 'loading' : 'ready'}">
    ${shouldTranslate ? `<div class="card-insight-row">
      <span class="card-insight-label">翻译</span>
      <p class="card-insight-text translation-text">${escapeHTML(translation || '正在翻译为中文…')}</p>
    </div>` : ''}
    <div class="card-insight-row">
      <span class="card-insight-label">摘要</span>
      <p class="card-insight-text summary-text">${escapeHTML(summary)}</p>
    </div>
  </div>`;

  const srcCls = tweet._source === 'bookmark' ? 'bookmark' : (tweet._source === 'home' ? 'home' : 'fav');
  const srcLbl = tweet._source === 'bookmark' ? '★ SAVE' : (tweet._source === 'home' ? 'HOME' : '♥ LIKE');
  const canUnlike = isTweetLiked(tweet);
  const tags = tweet._tags || [];
  const tagPills = tags.map(t => {
    const c = tagColor(t);
    return `<span class="tag-pill" style="background:${c.bg};color:${c.text}">${escapeHTML(t)}</span>`;
  }).join('');

  html += `<div class="card-footer">
    <div class="card-footer-meta">
      <span class="card-date">${date}</span>
      <span class="source-badge ${srcCls}">${srcLbl}</span>
    </div>
    <div class="card-footer-actions">
      ${canUnlike ? '<button class="unlike-button" type="button">取消 LIKE</button>' : ''}
      <button class="card-link" data-idx="${index}">VIEW →</button>
    </div>
  </div>`;
  if (tagPills) html += `<div class="card-tags">${tagPills}</div>`;

  html += `</div>`;
  card.innerHTML = html;

  card.querySelector('.card-link').addEventListener('click', (e) => {
    e.stopPropagation();
    if (typeof options.onOpen === 'function') options.onOpen(tweet, index);
    else openModalAt(index);
  });
  wireUnlikeButton(card.querySelector('.unlike-button'), tweet);

  wireRichMedia(card, getInternalPostSource(tweet, options.collection));

  const mediaTrack = card.querySelector('.card-media-track');
  if (mediaTrack) {
    const count = card.querySelector('.card-media > .media-count');
    mediaTrack.addEventListener('scroll', () => {
      const current = Math.round(mediaTrack.scrollLeft / Math.max(mediaTrack.clientWidth, 1)) + 1;
      if (count) count.textContent = `${Math.min(current, carouselCount)} / ${carouselCount}`;
    }, { passive: true });
  }

  return card;
}

// ── Masonry column management ──
function getColumnCount() {
  const w = window.innerWidth;
  if (w < 768) return 1;
  if (w < 1024) return 2;
  if (w < 1440) return 3;
  return 4;
}

function getHomeColumnCount() {
  return window.innerWidth < 768 ? 1 : 2;
}

let _currentColumnCount = 0;
let _currentHomeColumnCount = 0;

function ensureColumns(force) {
  const masonry = document.getElementById('masonry');
  const desired = getColumnCount();
  if (!force && desired === _currentColumnCount && masonry.querySelector('.masonry-col')) return false;
  cleanupCardVideos(masonry);
  masonry.innerHTML = '';
  for (let i = 0; i < desired; i++) {
    const col = document.createElement('div');
    col.className = 'masonry-col';
    masonry.appendChild(col);
  }
  _currentColumnCount = desired;
  return true;
}

function getShortestColumn(root = document.getElementById('masonry')) {
  const cols = root?.querySelectorAll(':scope > .masonry-col') || [];
  if (cols.length === 0) return null;
  let shortest = cols[0];
  let minHeight = shortest.offsetHeight;
  for (let i = 1; i < cols.length; i++) {
    const h = cols[i].offsetHeight;
    if (h < minHeight) {
      minHeight = h;
      shortest = cols[i];
    }
  }
  return shortest;
}

// ── Filtering ──
function applyFilters() {
  const q = searchQuery.toLowerCase();
  filteredTweets = allTweets.filter(t => {
    const mediaType = (t['MediaType'] || '').toLowerCase();
    const hasLink = t['HasLink'] === 'True';
    const textOnly = !mediaType && !hasLink;

    if (currentFilter === 'photo' && mediaType !== 'photo') return false;
    if (currentFilter === 'video' && mediaType !== 'video') return false;
    if (currentFilter === 'text' && !textOnly) return false;
    if (currentFilter === 'link' && !hasLink) return false;
    if (currentSource !== 'all' && t._source !== currentSource) return false;

    if (currentTags.length > 0) {
      const tweetTags = t._tags || [];
      if (!currentTags.some(tag => tweetTags.includes(tag))) return false;
    }

    if (q) {
      const text = (t['TweetText'] || '').toLowerCase();
      const name = (t['UserProfileName'] || '').toLowerCase();
      const handle = (t['UserScreenName'] || '').toLowerCase();
      const translation = (t.Translation || translationCache[getEnrichmentKey(t)]?.translation || '').toLowerCase();
      const summary = (t.Summary || translationCache[getEnrichmentKey(t)]?.summary || '').toLowerCase();
      const quoted = [t._quote?.author, t._quote?.handle, t._quote?.text, t._quote?.article?.title, t._quote?.article?.preview].filter(Boolean).join(' ').toLowerCase();
      const article = [t._article?.title, t._article?.preview, t._article?.fullText].filter(Boolean).join(' ').toLowerCase();
      const tags = (t._tags || []).join(' ').toLowerCase();
      if (![text, name, handle, translation, summary, quoted, article, tags].some(value => value.includes(q))) return false;
    }

    return true;
  });

  document.getElementById('countDisplay').textContent = filteredTweets.length;
  rendered = 0;
  ensureColumns(true);
  renderBatch();
}

function renderBatch() {
  const masonry = document.getElementById('masonry');

  if (filteredTweets.length === 0) {
    masonry.innerHTML = '<div class="empty-state"><div class="label">[NO RESULTS]</div></div>';
    _currentColumnCount = 0;
    rendered = 0;
    loading = false;
    return;
  }

  if (rendered >= filteredTweets.length || loading) return;
  loading = true;

  ensureColumns();

  const end = Math.min(rendered + BATCH_SIZE, filteredTweets.length);

  for (let i = rendered; i < end; i++) {
    const card = createCard(filteredTweets[i], i);
    const target = getShortestColumn();
    if (target) target.appendChild(card);
    else masonry.appendChild(card);
    prepareCardVideo(card);
    prepareCardEnrichment(card, filteredTweets[i]);
  }

  rendered = end;
  loading = false;
}

// ── Re-distribute existing cards on viewport resize when column count changes ──
let _resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(_resizeTimer);
  _resizeTimer = setTimeout(() => {
    if (document.getElementById('lightbox').classList.contains('open')) fitLightboxMedia();
    if (activeTab === 'home') {
      if (getHomeColumnCount() !== _currentHomeColumnCount) renderHomeFeed();
      return;
    }
    if (activeTab === 'media') {
      if (mediaMode === 'immersive') {
        document.querySelectorAll('.media-immersive-post').forEach(post => {
          const track = post.querySelector('.media-immersive-track');
          const index = Number(post.dataset.mediaIndex || 0);
          track.scrollLeft = track.clientWidth * index;
          syncImmersivePost(post);
        });
      }
      return;
    }
    if (!['likes', 'search'].includes(activeTab)) return;
    const desired = getColumnCount();
    if (desired === _currentColumnCount) return;
    const previouslyRendered = rendered;
    rendered = 0;
    ensureColumns(true);
    while (rendered < previouslyRendered && rendered < filteredTweets.length) {
      renderBatch();
    }
  }, 150);
}, { passive: true });

  } else if (imageUrls.length > 1) {

function navigateModal(dir) {
  const next = currentModalIndex + dir;
  const collection = currentModalCollection || filteredTweets;
  if (next >= 0 && next < collection.length) openModalAt(next, collection);
}

function stopModalVideo() {
  const el = document.getElementById('modalVideo');
  if (!el) return;
  if (el.tagName === 'VIDEO') { el.pause(); el.removeAttribute('src'); el.load(); }
  el.remove();
}

function closeModal() {
  stopModalVideo();
  const img = document.querySelector('#modal > img');
  if (img) img.remove();
  document.getElementById('modalBackdrop').classList.remove('open');
  syncPageScrollLock();
  currentModalIndex = -1;
  currentModalCollection = null;
}

function renderModalTags(tweet) {
  const section = document.getElementById('modalTagsSection');
  if (!section) return;
  const tags = tweet._tags || [];
  const suggestions = suggestTags(tweet);

  const pillsHTML = tags.map(t => {
    const c = tagColor(t);
    return `<span class="modal-tag-pill" style="background:${c.bg};color:${c.text}" data-tag="${escapeHTML(t)}">${escapeHTML(t)}<span class="tag-remove">✕</span></span>`;
  }).join('');

  const suggestHTML = suggestions.map(t =>
    `<button class="modal-tag-suggest" data-tag="${escapeHTML(t)}">+ ${escapeHTML(t)}</button>`
  ).join('');

  section.innerHTML = `
    <div class="modal-tags-label">Tags</div>
    <div class="modal-tags-list">${pillsHTML || '<span style="font-size:10px;color:var(--text-disabled);font-family:\'Space Mono\',monospace;letter-spacing:0.04em">NO TAGS</span>'}</div>

    </div>

  section.querySelectorAll('.tag-remove').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const tag = btn.parentElement.dataset.tag;
      tweet._tags = (tweet._tags || []).filter(t => t !== tag);
      saveTagsMap();
      renderModalTags(tweet);
      renderTagFilterRow();
    });
  });

  section.querySelectorAll('.modal-tag-suggest').forEach(btn => {
    btn.addEventListener('click', () => {
      const tag = btn.dataset.tag;
      if (!tweet._tags) tweet._tags = [];
      if (!tweet._tags.includes(tag)) tweet._tags.push(tag);
      saveTagsMap();
      renderModalTags(tweet);
      renderTagFilterRow();
    });
  });

  const input = document.getElementById('modalTagInput');
  input.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    const val = input.value.trim();
    if (!val) return;
    const tag = val.charAt(0).toUpperCase() + val.slice(1);
    if (!tweet._tags) tweet._tags = [];
    if (!tweet._tags.includes(tag)) {
      tweet._tags.push(tag);
      saveTagsMap();
      renderModalTags(tweet);
      renderTagFilterRow();
    }
    input.value = '';
  });

let pageScrollLock = null;

function syncPageScrollLock() {
  const modalOpen = document.getElementById('modalBackdrop').classList.contains('open');
  const lightboxOpen = document.getElementById('lightbox').classList.contains('open');
  const shouldLock = modalOpen || lightboxOpen;

  if (shouldLock && !pageScrollLock) {
    const body = document.body;
    pageScrollLock = {
      y: window.scrollY,
      position: body.style.position,
      top: body.style.top,
      left: body.style.left,
      right: body.style.right,
      width: body.style.width,
      overflow: body.style.overflow,
      overscroll: document.documentElement.style.overscrollBehavior
    };
    body.style.position = 'fixed';
    body.style.top = `-${pageScrollLock.y}px`;
    body.style.left = '0';
    body.style.right = '0';
    body.style.width = '100%';
    body.style.overflow = 'hidden';
    document.documentElement.style.overscrollBehavior = 'none';
    return;
  }

  if (!shouldLock && pageScrollLock) {
    const body = document.body;
    const lock = pageScrollLock;
    pageScrollLock = null;
    body.style.position = lock.position;
    body.style.top = lock.top;
    body.style.left = lock.left;
    body.style.right = lock.right;
    body.style.width = lock.width;
    body.style.overflow = lock.overflow;
    document.documentElement.style.overscrollBehavior = lock.overscroll;
    window.scrollTo(0, lock.y);
  }
}

function mediaItemFromElement(media) {
