<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Collection">
  <title>COLLECTION</title>
  <link rel="icon" type="image/svg+xml" href="app-icon.svg?v=20260726">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=20260726">
  <link rel="manifest" href="manifest.webmanifest?v=20260726">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Doto:wght@400;700&family=Space+Grotesk:wght@300;400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --black: #000000;
      --surface: #111111;
      --surface-raised: #1A1A1A;
      --border: #222222;
      --border-visible: #333333;
      --text-disabled: #666666;
      --text-secondary: #999999;
      --text-primary: #E8E8E8;
      --text-display: #FFFFFF;
      --accent: #D71921;
      --accent-subtle: rgba(215,25,33,0.15);
      --interactive: #5B9BF6;
      --interactive-subtle: rgba(91,155,246,0.12);
      --success: #4ade80;
      --success-subtle: rgba(74,222,128,0.12);
      --easing-standard: cubic-bezier(0.4, 0, 0.2, 1);
      --easing-decelerate: cubic-bezier(0, 0, 0.2, 1);
      --easing-accelerate: cubic-bezier(0.4, 0, 1, 1);
      --motion-short: 200ms;
      --motion-standard: 300ms;
      --space-xs: 4px;
      --space-sm: 8px;
      --space-md: 16px;
      --space-lg: 24px;
      --space-xl: 32px;
      --space-2xl: 48px;
      --space-3xl: 64px;
      --space-4xl: 96px;
      --col-gap: 16px;
      --radius-0: 0px;
      --radius-8: 8px;
      --radius-12: 12px;
      --radius-16: 16px;
      --radius-24: 24px;
      --radius-32: 32px;
      --card-radius: 12px;
      --digest-card-padding: var(--space-md);
      /* UI rule: nested radius = outer radius - inset, clamped at zero. */
      --digest-media-radius: max(var(--radius-0), calc(var(--radius-16) - var(--digest-card-padding)));
    }

    *,*::before,*::after { margin: 0; padding: 0; box-sizing: border-box; }

    html {
      background: var(--black);
      color: var(--text-primary);
      font-family: 'Space Grotesk', system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      position: relative;
      min-height: 100vh;
      padding: var(--space-xl) var(--space-lg) 132px;
      max-width: 1440px;
      margin: 0 auto;
    }

    .app-view { display: none; }
    .app-view.active { display: block; }

    .view-kicker {
      font-family: 'Space Mono', monospace;
      color: var(--text-secondary);
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .view-description {
      max-width: 680px;
      color: var(--text-secondary);
      font-size: 14px;
      line-height: 1.65;
      margin-top: var(--space-md);
    }

    /* === HOME DIGEST === */
    .home-hero {
      display: flex;
      justify-content: space-between;
      gap: var(--space-lg);
      align-items: end;
      padding-bottom: 20px;
      margin-bottom: var(--space-lg);
      border-bottom: 1px solid var(--border);
    }

    .home-hero .title { margin-top: 6px; }

    .home-summary {
      flex: 0 0 auto;
      padding-bottom: 3px;
      text-align: right;
    }

    .home-summary strong {
      display: block;
      color: var(--text-display);
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .home-date-group { margin-bottom: var(--space-2xl); }

    .home-date-heading {
      position: sticky;
      top: 0;
      z-index: 8;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: var(--space-md);
      margin-bottom: var(--space-md);
      padding: 10px 0;
      background: linear-gradient(var(--black) 75%, transparent);
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-secondary);
    }

    .home-date-heading .date { color: var(--text-display); }

    .digest-grid {
      display: flex;
      align-items: start;
      gap: var(--col-gap);
    }

    /* === MEDIA BROWSER === */
    .media-view {
      --media-nav-clearance: 100px;
      overscroll-behavior-x: none;
    }

    .media-mode-toolbar {
      position: sticky;
      top: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: var(--space-sm);
      padding: 6px 0 10px;
      background: transparent;
      touch-action: pan-y;
    }

    .media-mode-switch {
      --mode-drag-x: 0px;
      display: inline-grid;
      grid-template-columns: repeat(2, 44px);
      gap: 4px;
      padding: 3px;
      border: 1px solid var(--border-visible);
      border-radius: 26px;
      background: rgba(12,12,14,0.64);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.1),
        0 8px 28px rgba(0,0,0,0.24);
      backdrop-filter: blur(20px) saturate(145%);
      -webkit-backdrop-filter: blur(20px) saturate(145%);
      transform: translate3d(var(--mode-drag-x),0,0);
      transition: transform var(--motion-short) var(--easing-standard);
      will-change: transform;
    }

    .media-mode-switch.dragging { transition: none; }

    .media-mode-button {
      width: 44px;
      height: 44px;
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      border: 1px solid transparent;
      border-radius: 22px;
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      transition: color var(--motion-short) var(--easing-standard),
                  background var(--motion-short) var(--easing-standard),
                  border-color var(--motion-short) var(--easing-standard);
    }

    .media-mode-button svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .media-mode-button:hover { color: var(--text-primary); }
    .media-mode-button.active {
      color: var(--text-display);
      border-color: rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.08);
    }

    .media-mode-button:focus-visible {
      outline: 2px solid var(--interactive);
      outline-offset: 2px;
    }

    .media-mode-panel { display: none; }
    .media-mode-panel.active {
      display: block;
      animation: mediaModeIn var(--motion-short) var(--easing-decelerate) both;
    }

    @keyframes mediaModeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .media-view[data-mode-transition="forward"] .media-mode-panel.active {
      animation-name: mediaModeInForward;
    }

    .media-view[data-mode-transition="backward"] .media-mode-panel.active {
      animation-name: mediaModeInBackward;
    }

    @keyframes mediaModeInForward {
      from { opacity: 0; transform: translateX(18px); }
      to { opacity: 1; transform: translateX(0); }
    }

    @keyframes mediaModeInBackward {
      from { opacity: 0; transform: translateX(-18px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .material-grid {
      column-count: 2;
      column-gap: var(--space-sm);
    }

    .material-grid-item {
      position: relative;
      width: 100%;
      display: inline-block;
      margin: 0 0 var(--space-sm);
      break-inside: avoid;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: var(--radius-12);
      background: var(--surface);
      cursor: zoom-in;
      vertical-align: top;
      animation: materialItemIn var(--motion-standard) var(--easing-decelerate) both;
    }

    .material-grid-item:hover { border-color: var(--border-visible); }
    .material-grid-item:focus-visible {
      outline: 2px solid var(--interactive);
      outline-offset: 3px;
    }

    .material-grid-item.is-video { aspect-ratio: 4 / 5; }

    .material-grid-media {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
      background: var(--black);
      user-select: none;
      -webkit-user-drag: none;
    }

    .material-grid-item.is-video .material-grid-media {
      height: 100%;
    }

    .unlike-icon-button {
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      padding: 0;
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 50%;
      background: rgba(0,0,0,0.64);
      backdrop-filter: blur(12px) saturate(1.15);
      -webkit-backdrop-filter: blur(12px) saturate(1.15);
      color: rgba(255,255,255,0.84);
      cursor: pointer;
      transition: color var(--motion-short) var(--easing-standard),
                  border-color var(--motion-short) var(--easing-standard),
                  background var(--motion-short) var(--easing-standard),
                  transform var(--motion-short) var(--easing-standard);
    }

    .unlike-icon-button svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .unlike-icon-button:hover {
      color: var(--text-display);
      border-color: rgba(255,255,255,0.5);
      background: rgba(0,0,0,0.8);
      transform: scale(1.04);
    }

    .unlike-icon-button:focus-visible {
      outline: 2px solid var(--interactive);
      outline-offset: 3px;
    }

    .material-unlike {
      position: absolute;
      top: 8px;
      left: 8px;
      z-index: 3;
    }

    .material-media-error {
      min-height: 160px;
      display: grid;
      place-items: center;
      padding: var(--space-md);
      color: var(--text-disabled);
      font-family: 'Space Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.06em;
      text-align: center;
      text-transform: uppercase;
    }

    @keyframes materialItemIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .material-load-state {
      padding: var(--space-xl) 0 var(--space-2xl);
      color: var(--text-disabled);
      font-family: 'Space Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.08em;
      text-align: center;
      text-transform: uppercase;
    }

    .media-immersive-feed {
      height: calc(100dvh - 112px - var(--media-nav-clearance));
      min-height: 320px;
      overflow-y: auto;
      overscroll-behavior-y: contain;
      scroll-snap-type: y mandatory;
      scrollbar-width: none;
      border-radius: var(--radius-16);
      background: var(--black);
    }

    .media-immersive-feed::-webkit-scrollbar,
    .media-immersive-track::-webkit-scrollbar { display: none; }

    .media-immersive-post {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      border: 0;
      border-radius: var(--radius-16);
      background: var(--black);
      scroll-snap-align: start;
      scroll-snap-stop: always;
    }

    .media-immersive-track {
      width: 100%;
      height: 100%;
      display: flex;
      overflow-x: auto;
      overscroll-behavior-x: contain;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
    }

    .media-immersive-slide {
      position: relative;
      flex: 0 0 100%;
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: var(--black);
      cursor: zoom-in;
      scroll-snap-align: start;
      scroll-snap-stop: always;
    }

    .media-immersive-slide::before,
    .media-backdrop-slide::before,
    .lightbox-slide::before {
      content: '';
      position: absolute;
      inset: -28px;
      z-index: 0;
      background-image: var(--media-backdrop, none);
      background-position: center;
      background-repeat: no-repeat;
      background-size: cover;
      filter: blur(26px) brightness(0.46) saturate(0.82);
      opacity: 0;
      transform: scale(1.08);
      pointer-events: none;
    }

    .media-immersive-slide.has-media-backdrop::before,
    .media-backdrop-slide.has-media-backdrop::before,
    .lightbox-slide.has-media-backdrop::before {
      opacity: 0.82;
    }

    .media-immersive-slide::after,
    .media-backdrop-slide::after,
    .lightbox-slide::after {
      content: '';
      position: absolute;
      inset: 0;
      z-index: 0;
      background: rgba(0,0,0,0.22);
      pointer-events: none;
    }

    .media-backdrop-slide {
      position: relative;
      flex: 0 0 100%;
      width: 100%;
      min-width: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      scroll-snap-align: start;
      background: var(--black);
    }

    .media-backdrop-slide > img,
    .media-backdrop-slide > video {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      min-height: 0;
      display: block;
      object-fit: contain;
      background: transparent;
    }

    .media-immersive-slide:focus-visible {
      outline: 2px solid var(--interactive);
      outline-offset: -4px;
    }

    .media-immersive-media {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      z-index: 1;
      max-width: 100%;
      max-height: 100%;
      background: transparent;
      user-select: none;
      -webkit-user-drag: none;
    }

    .media-immersive-dots {
      position: absolute;
      left: 50%;
      bottom: max(14px, env(safe-area-inset-bottom));
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 9px;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 999px;
      background: rgba(0,0,0,0.58);
      backdrop-filter: blur(10px);
      transform: translateX(-50%);
    }

    .media-immersive-dots:empty,
    .media-immersive-dots.single { display: none; }

    .media-immersive-dot {
      width: 5px;
      height: 5px;
      border: 0;
      border-radius: 50%;
      background: rgba(255,255,255,0.38);
      cursor: pointer;
      transition: opacity var(--motion-short) var(--easing-standard),
                  transform var(--motion-short) var(--easing-standard),
                  background var(--motion-short) var(--easing-standard);
    }

    .media-immersive-dot.active {
      background: var(--text-display);
      transform: scale(1.45);
    }

    @media (min-width: 768px) {
      .material-grid { column-count: 3; column-gap: var(--space-md); }
      .material-grid-item { margin-bottom: var(--space-md); }
    }

    @media (min-width: 1024px) {
      .material-grid { column-count: 4; }
    }

    @media (min-width: 1440px) {
      .material-grid { column-count: 5; }
    }

    .digest-card {
      min-width: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      align-content: start;
      gap: var(--space-md);
      padding: var(--digest-card-padding);
      border: 1px solid var(--border);
      border-radius: var(--radius-16);
      color: inherit;
      text-decoration: none;
      background: linear-gradient(145deg, rgba(25,25,25,0.92), rgba(12,12,12,0.96));
      overflow: hidden;
      transition: transform 200ms ease, border-color 200ms ease, background 200ms ease;
    }

    .digest-card:hover {
      transform: translateY(-2px);
      border-color: var(--border-visible);
      background: linear-gradient(145deg, rgba(30,30,30,0.96), rgba(13,13,13,0.98));
    }

    .digest-card.no-media { grid-template-columns: 1fr; }

    .digest-card-meta {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      margin-bottom: var(--space-md);
    }

    .digest-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
      background: var(--surface-raised);
    }

    .digest-author { color: var(--text-display); font-size: 13px; font-weight: 500; }
    .digest-handle, .digest-time { color: var(--text-disabled); font-family: 'Space Mono', monospace; font-size: 10px; }

    .digest-category {
      display: inline-flex;
      margin-bottom: var(--space-sm);
      color: var(--interactive);
      font-family: 'Space Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .digest-title {
      color: var(--text-display);
      font-size: 18px;
      line-height: 1.35;
      font-weight: 500;
      margin-bottom: 10px;
    }

    .digest-summary { color: var(--text-secondary); font-size: 13px; line-height: 1.65; }

    .digest-source-link {
      display: inline-flex;
      align-items: center;
      min-height: 36px;
      margin-top: var(--space-md);
      color: var(--text-disabled);
      font-family: 'Space Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.04em;
      text-decoration: none;
      transition: color 160ms ease-out;
    }

    .digest-source-link:hover { color: var(--text-display); }

    .digest-metrics {
      margin-top: var(--space-md);
      color: var(--text-disabled);
      font-family: 'Space Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.02em;
    }

    .digest-media {
      width: 100%;
      height: 100%;
      min-height: 180px;
      border-radius: 12px;
      object-fit: cover;
      background: var(--surface-raised);
    }

    .digest-media-shell {
      position: relative;
      min-width: 0;
      width: 100%;
      aspect-ratio: 16 / 9;
      align-self: auto;
      order: -1;
      overflow: hidden;
      border-radius: var(--digest-media-radius);
      background: var(--surface-raised);
    }

    .digest-media-track {
      display: flex;
      width: 100%;
      height: 100%;
      overflow-x: auto;
      overscroll-behavior-inline: contain;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
    }

    .digest-media-track::-webkit-scrollbar { display: none; }

    .digest-media-track > .media-backdrop-slide {
      height: 100%;
    }

    .digest-media-track > .media-backdrop-slide > img { cursor: zoom-in; }

    .digest-media-shell .media-count { right: 10px; bottom: 10px; }

    .embedded-post {
      margin-top: var(--space-md);
      padding: 12px;
      border: 1px solid var(--border-visible);
      border-radius: 8px;
      background: rgba(255,255,255,0.025);
    }

    .embedded-post-head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .embedded-post-avatar {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      object-fit: cover;
      background: var(--surface-raised);
    }

    .embedded-post-author { color: var(--text-display); font-size: 12px; font-weight: 500; }
    .embedded-post-handle { color: var(--text-disabled); font-family: 'Space Mono', monospace; font-size: 9px; }
    .embedded-post-label { margin-left: auto; color: var(--text-disabled); font-family: 'Space Mono', monospace; font-size: 8px; letter-spacing: 0.08em; }
    .embedded-post-text { color: var(--text-secondary); font-size: 12px; line-height: 1.55; white-space: pre-line; }
    .embedded-post-link { color: inherit; text-decoration: none; }

    .embedded-post-media {
      position: relative;
      display: flex;
      margin-top: 10px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
      border-radius: 8px;
      background: var(--black);
    }

    .embedded-post-media::-webkit-scrollbar { display: none; }

    .embedded-post-media img,
    .embedded-post-media video {
      flex: 0 0 100%;
      width: 100%;
      max-height: 360px;
      object-fit: contain;
      scroll-snap-align: start;
      background: var(--black);
    }

    .x-article {
      margin-top: var(--space-md);
      border: 1px solid var(--border-visible);
      border-radius: 8px;
      overflow: hidden;
      background: rgba(255,255,255,0.025);
    }

    .x-article-cover {
      width: 100%;
      max-height: 300px;
      display: block;
      object-fit: cover;
      background: var(--surface-raised);
    }

    .x-article-summary {
      display: grid;
      gap: 6px;
      padding: 12px;
      cursor: pointer;
      list-style: none;
    }

    .x-article-summary::-webkit-details-marker { display: none; }
    .x-article-eyebrow { color: var(--interactive); font-family: 'Space Mono', monospace; font-size: 8px; letter-spacing: 0.08em; text-transform: uppercase; }
    .x-article-title { color: var(--text-display); font-size: 14px; font-weight: 500; line-height: 1.4; }
    .x-article-preview { color: var(--text-secondary); font-size: 12px; line-height: 1.55; }
    .x-article-action { color: var(--text-disabled); font-family: 'Space Mono', monospace; font-size: 9px; }
    .x-article[open] .x-article-action { display: none; }

    .x-article-body {
      padding: 0 12px 12px;
      color: var(--text-secondary);
      font-size: 13px;
      line-height: 1.7;
      white-space: pre-line;
    }

    .x-article-inline-media {
      display: grid;
      gap: 8px;
      margin-top: 12px;
    }

    .x-article-inline-media img,
    .x-article-inline-media video {
      width: 100%;
      max-height: 520px;
      object-fit: contain;
      border-radius: 8px;
      background: var(--black);
    }

    .x-article-original {
      display: inline-flex;
      min-height: 36px;
      align-items: center;
      margin-top: 10px;
      color: var(--interactive);
      font-family: 'Space Mono', monospace;
      font-size: 9px;
      text-decoration: none;
    }

    /* === HEADER === */
    .header {
      margin-bottom: var(--space-lg);
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }

    .header-top {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: var(--space-md);
      margin-bottom: 0;
    }

    .title {
      font-family: 'Doto', 'Space Mono', monospace;
      font-size: clamp(32px, 5vw, 44px);
      font-weight: 700;
      color: var(--text-display);
      line-height: 1.0;
      letter-spacing: -0.03em;
    }

    .search-view .header-top { margin-bottom: 20px; }

    .stats {
      font-family: 'Space Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-secondary);
      text-align: right;
    }

    .stats .count {
      font-size: 20px;
      color: var(--text-display);
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 300;
      letter-spacing: -0.01em;
      display: block;
      line-height: 1.2;
    }

    /* === CONTROLS === */
    .controls {
      display: flex;
      align-items: center;
      gap: var(--space-md);
      flex-wrap: wrap;
    }

    .search-box {
      flex: 1;
      min-width: 240px;
      max-width: 480px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--border-visible);
      color: var(--text-primary);
      font-family: 'Space Mono', monospace;
      font-size: 13px;
      padding: 10px 0;
      letter-spacing: 0.02em;
      outline: none;
      transition: border-color 200ms ease-out;
    }

    .search-box input::placeholder {
      color: var(--text-disabled);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-size: 11px;
    }

    .search-box input:focus {
      border-bottom-color: var(--text-primary);
    }

    .filter-tags {
      display: flex;
      gap: var(--space-sm);
      flex-wrap: wrap;
    }

    .filter-tag {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 6px 14px;
      border: 1px solid var(--border-visible);
      border-radius: 999px;
      color: var(--text-secondary);
      background: transparent;
      cursor: pointer;
      transition: all 200ms ease-out;
      white-space: nowrap;
    }

    .filter-tag:hover {
      color: var(--text-primary);
      border-color: var(--text-secondary);
    }

    .filter-tag.active {
      color: var(--text-display);
      border-color: var(--text-display);
    }

    .filter-divider {
      width: 1px;
      height: 20px;
      background: var(--border-visible);
      flex-shrink: 0;
    }

    /* === DROP ZONE === */
    .drop-zone {
      border: 2px dashed var(--border-visible);
      border-radius: var(--card-radius);
      padding: var(--space-lg) var(--space-xl);
      text-align: center;
      margin-bottom: var(--space-lg);
      transition: all 200ms ease-out;
      cursor: pointer;
      position: relative;
    }

    .drop-zone:hover, .drop-zone.drag-over {
      border-color: var(--interactive);
      background: var(--interactive-subtle);
    }

    .drop-zone-text {
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-disabled);
      line-height: 1.8;
    }

    .drop-zone-text strong {
      color: var(--text-secondary);
      font-weight: 400;
    }

    .drop-zone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }

    /* === DATA BAR === */
    .data-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-md);
      flex-wrap: wrap;
      margin-bottom: var(--space-xl);
      padding: var(--space-md) var(--space-lg);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--card-radius);
    }

    .data-stats {
      display: flex;
      gap: var(--space-lg);
      flex-wrap: wrap;
    }

    .data-stat {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-disabled);
    }

    .data-stat strong {
      color: var(--text-primary);
      font-weight: 400;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 14px;
    }

    .data-actions {
      display: flex;
      gap: var(--space-sm);
    }

    .data-btn {
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 6px 14px;
      border: 1px solid var(--border-visible);
      border-radius: 999px;
      color: var(--text-secondary);
      background: transparent;
      cursor: pointer;
      transition: all 200ms ease-out;
      white-space: nowrap;
    }

    .data-btn:hover {
      color: var(--text-display);
      border-color: var(--text-display);
    }


    /* === TOAST === */
    .toast {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--surface-raised);
      border: 1px solid var(--border-visible);
      border-radius: 8px;
      padding: 10px 20px;
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-primary);
      z-index: 3000;
      opacity: 0;
      transition: all 250ms ease-out;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* === SOURCE BADGES === */
    .card-footer-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .source-badge {
      font-family: 'Space Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 2px 6px;
      border-radius: 3px;
      white-space: nowrap;
    }

    .source-badge.fav {
      color: var(--accent);
      background: var(--accent-subtle);
    }

    .source-badge.bookmark {
      color: var(--interactive);
      background: var(--interactive-subtle);
    }

    .source-badge.home {
      color: var(--success);
      background: var(--success-subtle);
    }

    /* === MASONRY GRID === */
    .masonry {
      display: flex;
      align-items: flex-start;
      gap: var(--col-gap);
    }

    .masonry-col {
      flex: 1 1 0;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: var(--col-gap);
    }

    /* === CARD === */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--card-radius);
      overflow: hidden;
      transition: border-color 200ms ease-out;
      width: 100%;
    }

    .card:hover {
      border-color: var(--border-visible);
    }

    .card-media {
      width: 100%;
      position: relative;
      overflow: hidden;
      background: var(--surface-raised);
    }

    .card-media img {
      width: 100%;
      display: block;
      object-fit: cover;
    }

    .card-media-carousel { overflow: visible; }

    .card-media-track {
      display: flex;
      width: 100%;
      overflow-x: auto;
      overscroll-behavior-inline: contain;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
    }

    .card-media-track::-webkit-scrollbar { display: none; }

    .card-media-track > .media-backdrop-slide {
      aspect-ratio: 4 / 3;
    }

    .card-media-track > .media-backdrop-slide > img,
    .card-media-track > .media-backdrop-slide > video {
      object-fit: contain;
      background: transparent;
    }

    .card-media-track > .media-backdrop-slide > img {
      cursor: zoom-in;
    }

    .media-count {
      position: absolute;
      right: 8px;
      bottom: 8px;
      z-index: 2;
      padding: 3px 8px;
      border-radius: 999px;
      color: var(--text-display);
      background: rgba(0,0,0,0.66);
      backdrop-filter: blur(8px);
      font-family: 'Space Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.06em;
    }

    .card-media video {
      width: 100%;
      display: block;
      object-fit: cover;
      background: var(--black);
    }

    .card-media .card-video-fallback { display: none; }
    .card-media.video-unavailable video { display: none; }
    .card-media.video-unavailable .card-video-fallback { display: block; }

    .card-media .video-badge {
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 2;
      font-family: 'Space Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-display);
      background: rgba(0,0,0,0.7);
      padding: 3px 8px;
      border-radius: 4px;
      backdrop-filter: blur(4px);
    }

    .card-body {
      padding: var(--space-md);
    }

    .card-insight {
      display: grid;
      gap: 8px;
      margin: 14px 0 2px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }

    .card-insight-row {
      display: grid;
      grid-template-columns: 46px minmax(0, 1fr);
      gap: 8px;
      align-items: start;
    }

    .card-insight-label {
      padding-top: 2px;
      color: var(--text-disabled);
      font-family: 'Space Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .card-insight-text {
      color: var(--text-secondary);
      font-size: 12px;
      line-height: 1.55;
    }

    .card-insight[data-state="loading"] .translation-text { opacity: 0.55; }
    .card-insight[data-state="error"] .translation-text { color: var(--text-disabled); }

    .card-user {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      margin-bottom: 10px;
    }

    .card-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
      background: var(--surface-raised);
    }

    .card-user-info {
      min-width: 0;
    }

    .card-name {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-primary);
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-handle {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      color: var(--text-disabled);
      letter-spacing: 0.02em;
      line-height: 1.2;
    }

    .card-text {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 14px;
      line-height: 1.55;
      color: var(--text-primary);
      margin-bottom: 12px;
      word-break: break-word;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 8;
      -webkit-box-orient: vertical;
    }

    .card-text a {
      color: var(--interactive);
      text-decoration: none;
    }

    .card-text a:hover {
      text-decoration: underline;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-sm);
    }

    .card-footer-actions,
    .modal-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      min-width: 0;
    }

    .card-date {
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-disabled);
    }

    .card-link {
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-secondary);
      text-decoration: none;
      padding: 4px 10px;
      border: 1px solid var(--border-visible);
      border-radius: 999px;
      transition: all 200ms ease-out;
      white-space: nowrap;
      background: transparent;
      cursor: pointer;
    }

    .card-link:hover {
      color: var(--text-display);
      border-color: var(--text-display);
    }

    .unlike-button {
      font-family: 'Space Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--accent);
      padding: 4px 9px;
      border: 1px solid rgba(215,25,33,0.46);
      border-radius: 999px;
      background: var(--accent-subtle);
      cursor: pointer;
      white-space: nowrap;
      transition: color var(--motion-short) var(--easing-standard),
                  border-color var(--motion-short) var(--easing-standard),
                  background var(--motion-short) var(--easing-standard);
    }

    .unlike-button:hover {
      color: #ff5b62;
      border-color: #ff5b62;
      background: rgba(215,25,33,0.24);
    }

    .unlike-button:focus-visible {
      outline: 2px solid var(--interactive);
      outline-offset: 2px;
    }

    /* === EMPTY STATE === */
    .empty-state {
      text-align: center;
      padding: var(--space-4xl) var(--space-xl);
    }

    .empty-state .label {
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-disabled);
    }

    /* === LOADING === */
    .loading {
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-secondary);
      text-align: center;
      padding: var(--space-4xl);
    }

    /* === DOT GRID BG === */
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: radial-gradient(circle, var(--border) 0.5px, transparent 0.5px);
      background-size: 24px 24px;
      pointer-events: none;
      z-index: -1;
      opacity: 0.4;
    }

    /* === LIQUID GLASS TAB BAR === */
    .liquid-glass-stage {
      position: fixed;
      inset: 0;
      z-index: 900;
      pointer-events: none;
      overflow: visible;
    }

    .liquid-glass-scene {
      position: fixed;
      left: 50%;
      bottom: max(4px, calc(env(safe-area-inset-bottom) - 12px));
      width: min(320px, 100vw);
      height: 96px;
      transform: translateX(-50%);
      opacity: 0;
      pointer-events: none;
    }

    .bottom-tab-bar {
      --tab-bar-height: 64px;
      position: fixed;
      left: 50%;
      bottom: max(20px, env(safe-area-inset-bottom));
      z-index: 1;
      width: min(288px, calc(100vw - 32px));
      height: var(--tab-bar-height);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 2px;
      padding: 6px;
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: calc(var(--tab-bar-height) / 2);
      background: rgba(17,17,19,0.48);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), inset 0 -1px 0 rgba(255,255,255,0.04);
      backdrop-filter: blur(24px) saturate(165%) contrast(1.04);
      -webkit-backdrop-filter: blur(24px) saturate(165%) contrast(1.04);
      transform: translateX(-50%) translateZ(0);
      isolation: isolate;
      overflow: visible;
      pointer-events: auto;
      transition: background var(--motion-short) var(--easing-standard), border-color var(--motion-short) var(--easing-standard);
    }

    .bottom-tab-bar::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: 1;
      border-radius: inherit;
      background:
        radial-gradient(circle at 30% 0%, rgba(255,255,255,0.13), transparent 42%),
        linear-gradient(115deg, rgba(115,190,255,0.04), transparent 34%, rgba(255,168,226,0.035));
      pointer-events: none;
      transition: opacity var(--motion-short) var(--easing-standard);
    }

    .bottom-tab-bar::after {
      content: '';
      position: absolute;
      inset: 0;
      z-index: 1;
      border-radius: inherit;
      background: rgba(0,0,0,0.48);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--motion-short) var(--easing-standard);
    }

    .bottom-tab-bar > canvas {
      z-index: 0 !important;
      pointer-events: none;
    }

    .bottom-tab-bar.shader-ready {
      border-color: rgba(255,255,255,0.14);
      background: transparent;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.16),
        inset 0 -1px 0 rgba(255,255,255,0.05),
        0 10px 32px rgba(0,0,0,0.28);
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
    }

    .bottom-tab-bar.shader-ready::before { opacity: 0; }
    .bottom-tab-bar.shader-ready::after { opacity: 1; }

    .tab-button {
      position: relative;
      z-index: 2;
      min-width: 0;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid transparent;
      border-radius: calc(52px / 2);
      color: rgba(255,255,255,0.72);
      background: transparent;
      cursor: pointer;
      transition: color 180ms ease, border-color 180ms ease, background 180ms ease, transform 180ms ease;
    }

    .tab-button:hover { color: var(--text-primary); }
    .tab-button:active { transform: scale(0.96); }

    .tab-button:focus-visible {
      box-shadow: 0 0 0 3px rgba(91,155,246,0.28);
    }

    .tab-button.active {
      color: var(--text-display);
      border-color: rgba(255,255,255,0.16);
      background: rgba(0,0,0,0.24);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
    }

    .tab-button svg,
    .scroll-top svg {
      width: 24px;
      height: 24px;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,0.56));
    }

    .scroll-top svg {
      transform: scale(0.9);
      transform-origin: center;
    }

    .search-view #collectionSurface .drop-zone,
    .search-view #collectionSurface .data-bar { display: none !important; }

    /* === SCROLL TO TOP === */
    .scroll-top {
      position: fixed;
      right: max(16px, calc(50vw - 200px));
      bottom: calc(max(20px, env(safe-area-inset-bottom)) + 10px);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--surface);
      border: 1px solid var(--border-visible);
      color: var(--text-secondary);
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      transition: all 200ms ease-out;
      z-index: 100;
    }

    .scroll-top:hover {
      border-color: var(--text-display);
      color: var(--text-display);
    }

    .scroll-top.visible {
      display: flex;
    }

    /* === MODAL === */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: var(--space-lg);
      opacity: 0;
      transition: opacity 200ms ease-out;
    }

    .modal-backdrop.open {
      display: flex;
      opacity: 1;
    }

    .modal-wrapper {
      position: relative;
      width: 100%;
      max-width: 640px;
      margin: 0 60px;
    }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border-visible);
      border-radius: 16px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
      transform: translateY(8px);
      transition: transform 200ms ease-out;
    }

    .modal-backdrop.open .modal {
      transform: translateY(0);
    }

    .modal::-webkit-scrollbar { width: 4px; }
    .modal::-webkit-scrollbar-track { background: transparent; }
    .modal::-webkit-scrollbar-thumb { background: var(--border-visible); border-radius: 2px; }

    .modal-close {
      position: sticky;
      top: 0;
      float: right;
      margin: var(--space-md) var(--space-md) 0 0;
      width: 36px;
      height: 36px;
      background: var(--surface-raised);
      border: 1px solid var(--border-visible);
      border-radius: 50%;
      color: var(--text-secondary);
      font-family: 'Space Mono', monospace;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 200ms ease-out;
      z-index: 2;
    }

    .modal-close:hover {
      color: var(--text-display);
      border-color: var(--text-display);
    }

    .modal-media { width: 100%; border-top: 1px solid var(--border); }
    .modal-media img { width: 100%; display: block; object-fit: contain; max-height: 420px; background: var(--black); }

    #modal > img {
      width: 100%; display: block; object-fit: contain; max-height: 420px;
      background: var(--black); cursor: pointer; border-top: 1px solid var(--border);
    }

    .modal-media video, #modalVideo {
      width: 100%; display: block; max-height: 480px; background: var(--black); outline: none;
    }


    .modal-media-gallery {
      display: flex;
      gap: 2px;
      overflow-x: auto;
      overscroll-behavior-inline: contain;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
    }

    .modal-media-gallery::-webkit-scrollbar { display: none; }

    .modal-media-gallery.single-col { grid-template-columns: 1fr; }

    .modal-media-gallery img {
      flex: 0 0 100%; width: 100%; object-fit: cover; aspect-ratio: 4/3;
      scroll-snap-align: start;
      cursor: pointer; transition: opacity 200ms ease-out; display: block;
    }

    .modal-media-gallery img:only-child {
      aspect-ratio: auto; max-height: 480px; object-fit: contain;
    }

    .modal-media-gallery img:hover { opacity: 0.8; }

    /* === FULLSCREEN MEDIA VIEWER === */
    .viewer-launch {
      cursor: zoom-in;
    }

    .lightbox {
      --viewer-offset: 0%;
      --viewer-dx: 0px;
      --viewer-shell-x: 0px;
      --viewer-y: 0px;

const cardVideoObserver = 'IntersectionObserver' in window
  ? new IntersectionObserver(entries => {
      entries.forEach(entry => {
        const video = entry.target;
        if (entry.isIntersecting && !video.src) {
          video.src = video.dataset.src;
          video.load();
        }
        if (entry.isIntersecting && entry.intersectionRatio >= 0.45 && !document.hidden) {
          video.muted = true;
          video.play().catch(() => {});
        } else {
          video.pause();
        }
      });
    }, { threshold: [0, 0.45, 1], rootMargin: '80px 0px' })
  : null;

function prepareCardVideo(card) {
  card.querySelectorAll('.card-video[data-src]').forEach(video => {
    if (video.dataset.prepared === 'true') return;
    video.dataset.prepared = 'true';
    video.addEventListener('error', () => {
      video.closest('.card-media, .digest-media-shell, .embedded-post-media')?.classList.add('video-unavailable');
    });

    if (cardVideoObserver) {
      cardVideoObserver.observe(video);
    } else {
      video.src = video.dataset.src;
      video.load();
      video.muted = true;
      video.play().catch(() => {});
    }
  });
}

function cleanupCardVideos(container) {
  container.querySelectorAll('.card-video').forEach(video => {
    video.pause();
    if (cardVideoObserver) cardVideoObserver.unobserve(video);
  });
  if (typeof cardEnrichmentObserver !== 'undefined' && cardEnrichmentObserver) {
    container.querySelectorAll('.card').forEach(card => cardEnrichmentObserver.unobserve(card));
  }
}

document.addEventListener('visibilitychange', () => {
  document.querySelectorAll('.card-video').forEach(video => {
    if (document.hidden) {
      video.pause();
      return;
    }

    const rect = video.getBoundingClientRect();
    if (rect.width <= 0 || rect.height <= 0) {
      video.pause();
      return;
    }
    const visibleHeight = Math.min(rect.bottom, window.innerHeight) - Math.max(rect.top, 0);
    if (visibleHeight > 0 && visibleHeight >= Math.min(rect.height * 0.45, window.innerHeight * 0.45)) {
      video.muted = true;
      video.play().catch(() => {});
    }
  });
  syncImmersivePlayback();
});

function tagColor(tag) {
  let hash = 0;
  for (let i = 0; i < tag.length; i++) hash = ((hash << 5) - hash + tag.charCodeAt(i)) | 0;
  return TAG_COLORS[Math.abs(hash) % TAG_COLORS.length];
}

function autoTagTweet(tweet) {
  const text = (tweet['TweetText'] || '').toLowerCase();
  const tags = [];
  for (const rule of TAG_RULES) {
    if (rule.keywords.some(kw => text.includes(kw))) tags.push(rule.tag);
  }
  return tags;
}

// ── CSV Parser ──
function parseCSV(text) {
  const lines = [];
  let current = '';
  let inQuotes = false;

  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (ch === '"') {
      if (inQuotes && text[i + 1] === '"') { current += '"'; i++; }
      else { inQuotes = !inQuotes; }
    } else if (ch === ',' && !inQuotes) {
      lines.push(current); current = '';
    } else if ((ch === '\n' || ch === '\r') && !inQuotes) {
      if (current.length > 0 || lines.length > 0) {
        lines.push(current);
        if (lines.length > 1) yield_row(lines);
        lines.length = 0; current = '';
      }
      if (ch === '\r' && text[i + 1] === '\n') i++;
    } else {
      current += ch;
    }
  }
  if (current.length > 0 || lines.length > 0) {
    lines.push(current);
    if (lines.length > 1) yield_row(lines);
  }
}

const _rows = [];
function yield_row(fields) { _rows.push([...fields]); }

function parseCSVFull(text) {
  _rows.length = 0;
  parseCSV(text);
  if (_rows.length < 2) return [];
  const headers = _rows[0].map(h => h.trim());
  return _rows.slice(1).map(fields => {
    const obj = {};
    headers.forEach((h, i) => { obj[h] = (fields[i] || '').trim(); });
    return obj;
  });
}

const FIELD_MAP = {
  TweetID:         ['TweetID', 'id', 'tweet_id', 'rest_id', 'ID'],
  TwitterUserID:   ['TwitterUserID', 'user_id', 'author_id'],
  UserScreenName:  ['UserScreenName', 'screen_name', 'username', 'handle'],

  'Tweet Url':     ['Tweet Url', 'tweet_url', 'url', 'link', 'permalink'],
  TweetCreatedDate:['TweetCreatedDate', 'created_at', 'date', 'timestamp', 'tweeted_at'],
  MediaType:       ['MediaType', 'media_type', 'type'],
  MediaImageUrl:   ['MediaImageUrl', 'media_url', 'image_url', 'media_image_url', 'photos'],

function parseJSONField(value) {
  if (!value) return null;
  if (typeof value === 'object') return value;
  try { return JSON.parse(value); } catch { return null; }
}

function unwrapTweetResult(node) {
  let current = node?.result || node || null;
  if (current?.tweet) current = current.tweet;
  return current;
}

function graphUserData(node) {
  const result = unwrapTweetResult(node?.core?.user_results);
  const legacy = result?.legacy || {};
  const core = result?.core || {};
  const avatar = result?.avatar?.image_url || legacy.profile_image_url_https || '';
  return {
    author: core.name || legacy.name || '',
    handle: core.screen_name || legacy.screen_name || '',
    avatar
  };
}

function graphMediaData(mediaList) {
  return (mediaList || []).map(media => {
    const variants = (media.video_info?.variants || [])
      .filter(item => item.content_type === 'video/mp4')
      .sort((a, b) => (b.bitrate || 0) - (a.bitrate || 0));
    const balanced = variants.find(item => /\/(?:1280|1058|1136|720)x(?:720|1280)\//.test(item.url))
      || variants.find(item => (item.bitrate || 0) >= 1500000)
      || variants[0];
    return {
      type: media.type === 'photo' ? 'image' : 'video',
      src: media.type === 'photo' ? (media.media_url_https || '') : (balanced?.url || ''),
      poster: media.type === 'photo' ? '' : (media.media_url_https || '')
    };
  }).filter(item => item.src || item.poster);
}

function articleTextFromResult(article) {
  const blocks = article?.content_state?.blocks || article?.content?.blocks || article?.blocks || [];
  const text = blocks.map((block, index) => {
    const value = block.text || block.data?.text || block.content?.text || '';
    if (!value.trim() || block.type === 'atomic') return '';
    if (block.type === 'unordered-list-item') return `• ${value}`;
    if (block.type === 'ordered-list-item') return `${index + 1}. ${value}`;
    if (/header|heading/.test(block.type || '')) return `\n${value}\n`;
    return value;
  }).filter(Boolean).join('\n\n');
  return text || article?.plain_text || article?.body || '';
}

function articleMediaFromResult(article) {
  const candidates = [];
  const seen = new WeakSet();
  const stack = [article?.content_state, article?.content, article?.media_entities, article?.inline_media].filter(Boolean);
  while (stack.length && candidates.length < 24) {
    const value = stack.pop();
    if (!value || typeof value !== 'object' || seen.has(value)) continue;
    seen.add(value);
    if (value.original_img_url || value.media_url_https) {
      candidates.push({ type: 'image', src: value.original_img_url || value.media_url_https });
    }
    if (value.video_info) candidates.push(...graphMediaData([value]));
    Object.values(value).forEach(child => {
      if (child && typeof child === 'object') stack.push(child);
    });
  }
  return candidates.filter((item, index, all) => item.src && all.findIndex(other => other.src === item.src) === index);
}

function graphArticleData(node) {
  const article = node?.article?.article_results?.result;
  if (!article) return null;
  const cover = article.cover_media?.media_info?.original_img_url || '';
  return {
    kind: 'x',
    title: article.title || 'X 长文',
    preview: article.preview_text || '',
    fullText: articleTextFromResult(article),
    cover,
    media: articleMediaFromResult(article).filter(item => item.src !== cover),
    url: article.rest_id ? `https://x.com/i/article/${article.rest_id}` : ''
  };
}

function graphPostData(node, label = '引用原帖') {
  const tweet = unwrapTweetResult(node);
  if (!tweet) return null;
  const legacy = tweet.legacy || tweet;
  const note = tweet.note_tweet?.note_tweet_results?.result?.text || tweet.note_tweet?.text || '';
  const user = graphUserData(tweet);
  const id = tweet.rest_id || legacy.id_str || '';
  const media = graphMediaData(legacy.extended_entities?.media || legacy.entities?.media);
  const article = graphArticleData(tweet);
  if (!legacy.full_text && !note && !article && !media.length) return null;
  return {
    label,
    ...user,
    text: note || legacy.full_text || '',
    url: user.handle && id ? `https://x.com/${user.handle}/status/${id}` : '',
    media,
    article
  };
}

function metadataExtras(raw) {
  const metadata = parseJSONField(raw.metadata || raw.Metadata || raw.raw_json);
  if (!metadata) return {};
  const root = unwrapTweetResult(metadata);
  if (!root) return {};
  const extras = {};
  const article = graphArticleData(root);
  if (article) extras._article = article;
  const quote = graphPostData(root.quoted_status_result, '引用原帖');
  const repost = graphPostData(root.retweeted_status_result, '转载原帖');
  if (quote || repost) extras._quote = quote || repost;
  const legacy = root.legacy || root;
  const media = graphMediaData(legacy.extended_entities?.media || legacy.entities?.media);
  if (media.length) extras._metadataMedia = media;
  return extras;
}

function normalizeTweet(raw) {
  const out = {};
  for (const [canonical, aliases] of Object.entries(FIELD_MAP)) {
    out[canonical] = '';
    for (const alias of aliases) {
      if (raw[alias] != null && raw[alias] !== '') {
        out[canonical] = String(raw[alias]).trim();
        break;
      }
    }
  }

  if (!out.TweetID && out['Tweet Url']) {
    const m = out['Tweet Url'].match(/status\/(\d+)/);
    if (m) out.TweetID = m[1];
  }

  if (!out['Tweet Url'] && out.TweetID && out.UserScreenName) {
    out['Tweet Url'] = `https://twitter.com/${out.UserScreenName}/status/${out.TweetID}`;
  }

  // twitter-web-exporter: parse the `media` JSON column for MediaType/Image/Video
  if ((!out.MediaType || !out.MediaImageUrl) && raw.media && raw.media !== '[]') {
    try {
      const mediaArr = typeof raw.media === 'string' ? JSON.parse(raw.media) : raw.media;
      if (Array.isArray(mediaArr) && mediaArr.length > 0) {
        const photos = mediaArr.filter(m => m.type === 'photo');
        const videos = mediaArr.filter(m => m.type === 'video' || m.type === 'animated_gif');

        if (videos.length > 0) {
          out.MediaType = 'video';
          out.MediaImageUrl = videos[0].thumbnail || videos[0].original || '';
          out.MediaVideoUrl = videos[0].original || '';
        } else if (photos.length > 0) {
          out.MediaType = 'photo';
          out.MediaImageUrl = photos.map(p => p.original || p.url || '').join(',');
        }
      }
    } catch (e) { /* not valid JSON, skip */ }
  }

  if (out.HasLink === '') {
    const text = out.TweetText || '';
    const hasTcoLink = /https?:\/\/t\.co\/\S+/.test(text);
    out.HasLink = hasTcoLink ? 'True' : 'False';
  }

  Object.assign(out, metadataExtras(raw));
  if ((!out.MediaImageUrl || !out.MediaType) && out._metadataMedia?.length) {
    const images = out._metadataMedia.filter(item => item.type === 'image').map(item => item.src);
    const video = out._metadataMedia.find(item => item.type === 'video' && item.src);
    if (video) {
      out.MediaType = 'video';
      out.MediaVideoUrl = out.MediaVideoUrl || video.src;
      out.MediaImageUrl = out.MediaImageUrl || video.poster;
    } else if (images.length) {
      out.MediaType = 'photo';
      out.MediaImageUrl = images.join(',');
    }
  }

  return out;
}

function guessSource(filename) {
  const lower = (filename || '').toLowerCase();
  if (lower.includes('bookmark') || lower.includes('save') || lower.includes('书签')) return 'bookmark';
  if (lower.includes('like') || lower.includes('fav') || lower.includes('喜欢') || lower.includes('赞')) return 'favourite';
  return 'favourite';
}

// ── localStorage persistence ──
function saveToStorage() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(allTweets));
  } catch (e) {
    console.warn('Storage full, data not saved');
  }
}

function loadFromStorage() {
  try {
    const data = localStorage.getItem(STORAGE_KEY);
    const tweets = data ? JSON.parse(data) : [];
    return Array.isArray(tweets) ? tweets.filter(tweet => !isTweetSuppressed(tweet)) : [];
  } catch (e) {
    return [];
  }
}

function loadUnlikedTweetIds() {
  try {
    const ids = JSON.parse(localStorage.getItem(UNLIKED_KEY) || '[]');
    return new Set(Array.isArray(ids) ? ids.map(String).filter(Boolean) : []);
  } catch {
    return new Set();
  }
}

function saveUnlikedTweetIds() {
  try {
    localStorage.setItem(UNLIKED_KEY, JSON.stringify([...unlikedTweetIds]));
  } catch (e) {
    console.warn('Unable to persist unlike exclusions');
  }
}

function getPersistentTweetId(tweet) {
  if (!tweet) return '';
  const tweetUrl = String(tweet['Tweet Url'] || '');
  const statusId = tweetUrl.match(/\/status\/(\d+)/i)?.[1];
  return statusId || String(tweet.TweetID || '').trim();
}

function isTweetSuppressed(tweet) {
  const id = getPersistentTweetId(tweet);
  return Boolean(id && unlikedTweetIds.has(id));
}

function refreshLikedTweetIds() {
  likedTweetIds = new Set(
    allTweets
      .filter(tweet => tweet._source === 'favourite' && !isTweetSuppressed(tweet))
      .map(getPersistentTweetId)
      .filter(Boolean)
  );
}

function isTweetLiked(tweet) {
  if (!tweet || isTweetSuppressed(tweet)) return false;
  const id = getPersistentTweetId(tweet);
  return tweet._source === 'favourite' || Boolean(id && likedTweetIds.has(id));
}

function clearStorage() {
  localStorage.removeItem(STORAGE_KEY);
}

// ── Merge & deduplicate ──
function mergeTweets(existing, incoming) {
  const seen = new Set();
  const byId = new Map();
  const result = [];
  for (const t of existing) {
    if (isTweetSuppressed(t)) continue;
    if (t.TweetID && !seen.has(t.TweetID)) {
      seen.add(t.TweetID);
      result.push(t);
      byId.set(t.TweetID, t);
    }
  }
  let added = 0;
  for (const t of incoming) {
    if (isTweetSuppressed(t)) continue;
    if (t.TweetID && seen.has(t.TweetID)) {
      const current = byId.get(t.TweetID);
      if (current) {
        for (const [key, value] of Object.entries(t)) {
          if (key.startsWith('_') && value) current[key] = value;
          else if (!current[key] && value) current[key] = value;
        }
      }
    } else if (t.TweetID) {
      seen.add(t.TweetID);
      result.push(t);
      byId.set(t.TweetID, t);
      added++;
    }
  }
  result.sort((a, b) => new Date(b.TweetCreatedDate) - new Date(a.TweetCreatedDate));
  return { merged: result, added };
}

// ── Import CSV files ──
function importCSVText(text, source) {
  const raw = parseCSVFull(text);
  return raw.map(r => {
    const t = normalizeTweet(r);
    t._source = t._source || source;
    return t;
  }).filter(t => t.TweetID);
}

function handleFiles(files) {
  let totalAdded = 0;
  let processed = 0;

  for (const file of files) {
    const reader = new FileReader();
    reader.onload = function(e) {
      const text = e.target.result;
      const source = guessSource(file.name);
      let tweets;

      if (file.name.endsWith('.json')) {
        try {
          const data = JSON.parse(text);
          const arr = Array.isArray(data) ? data : (data.tweets || data.data || [data]);
          tweets = arr.map(r => {
            const t = normalizeTweet(r);
            t._source = source;
            return t;
          }).filter(t => t.TweetID);
        } catch (err) {
          tweets = [];
        }
      } else {
        tweets = importCSVText(text, source);
      }

      tweets.forEach(t => { if (!t._tags || !t._tags.length) t._tags = autoTagTweet(t); });
      const { merged, added } = mergeTweets(allTweets, tweets);
      allTweets = merged;
      refreshLikedTweetIds();
      totalAdded += added;
      processed++;

      if (processed === files.length) {
        saveToStorage();
        saveTagsMap();
        renderTagFilterRow();
        applyFilters();
        updateDataBar();
        materialBrowserReady = false;
        if (activeTab === 'media') renderMaterialBrowser(true);
        showToast(`+${totalAdded} NEW TWEETS IMPORTED`);
      }
    };
    reader.readAsText(file);
  }
}

// ── Export combined CSV ──
function exportAllCSV() {
  const headers = Object.keys(FIELD_MAP);
  const csvRows = [headers.join(',')];

  for (const t of allTweets) {
    const row = headers.map(h => {
      const val = t[h] || '';
      if (val.includes(',') || val.includes('"') || val.includes('\n')) {
        return '"' + val.replace(/"/g, '""') + '"';
      }
      return val;
    });
    csvRows.push(row.join(','));
  }

  const csv = csvRows.join('\n');
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `Twitter_Collection_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  showToast(`EXPORTED ${allTweets.length} TWEETS`);
}

function wireUnlikeButton(button, tweet) {
