<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COLLECTION</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23000000'/%3E%3Ccircle cx='10' cy='10' r='2.4' fill='%23666666'/%3E%3Ccircle cx='22' cy='10' r='2.4' fill='%23666666'/%3E%3Ccircle cx='10' cy='22' r='2.4' fill='%23666666'/%3E%3Ccircle cx='22' cy='22' r='2.4' fill='%23D71921'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Doto:wght@400;700&family=Space+Grotesk:wght@300;400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --black: #000000;
      --surface: #111111;
      --surface-raised: #1A1A1A;
      --border: #222222;
      --border-visible: #333333;
      --text-disabled: #666666;
      --text-secondary: #999999;
      --text-primary: #E8E8E8;
      --text-display: #FFFFFF;
      --accent: #D71921;
      --accent-subtle: rgba(215,25,33,0.15);
      --interactive: #5B9BF6;
      --interactive-subtle: rgba(91,155,246,0.12);
      --success: #4ade80;
      --success-subtle: rgba(74,222,128,0.12);
      --space-xs: 4px;
      --space-sm: 8px;
      --space-md: 16px;
      --space-lg: 24px;
      --space-xl: 32px;
      --space-2xl: 48px;
      --space-3xl: 64px;
      --space-4xl: 96px;
      --col-gap: 16px;
      --card-radius: 12px;
    }

    *,*::before,*::after { margin: 0; padding: 0; box-sizing: border-box; }

    html {
      background: var(--black);
      color: var(--text-primary);
      font-family: 'Space Grotesk', system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      min-height: 100vh;
      padding: var(--space-xl) var(--space-lg);
      max-width: 1440px;
      margin: 0 auto;
    }

    /* === HEADER === */
    .header {
      margin-bottom: var(--space-lg);
      padding-bottom: var(--space-xl);
      border-bottom: 1px solid var(--border);
    }

    .header-top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: var(--space-md);
      margin-bottom: var(--space-2xl);
    }

    .title {
      font-family: 'Doto', 'Space Mono', monospace;
      font-size: clamp(48px, 8vw, 72px);
      font-weight: 700;
      color: var(--text-display);
      line-height: 1.0;
      letter-spacing: -0.03em;
    }

    .stats {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-secondary);
      text-align: right;
    }

    .stats .count {
      font-size: 24px;
      color: var(--text-display);
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 300;
      letter-spacing: -0.01em;
      display: block;
      line-height: 1.2;
    }

    /* === CONTROLS === */
    .controls {
      display: flex;
      align-items: center;
      gap: var(--space-md);
      flex-wrap: wrap;
    }

    .search-box {
      flex: 1;
      min-width: 240px;
      max-width: 480px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--border-visible);
      color: var(--text-primary);
      font-family: 'Space Mono', monospace;
      font-size: 13px;
      padding: 10px 0;
      letter-spacing: 0.02em;
      outline: none;
      transition: border-color 200ms ease-out;
    }

    .search-box input::placeholder {
      color: var(--text-disabled);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-size: 11px;
    }

    .search-box input:focus {
      border-bottom-color: var(--text-primary);
    }

    .filter-tags {
      display: flex;
      gap: var(--space-sm);
      flex-wrap: wrap;
    }

    .filter-tag {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 6px 14px;
      border: 1px solid var(--border-visible);
      border-radius: 999px;
      color: var(--text-secondary);
      background: transparent;
      cursor: pointer;
      transition: all 200ms ease-out;
      white-space: nowrap;
    }

    .filter-tag:hover {
      color: var(--text-primary);
      border-color: var(--text-secondary);
    }

    .filter-tag.active {
      color: var(--text-display);
      border-color: var(--text-display);
    }

    .filter-divider {
      width: 1px;
      height: 20px;
      background: var(--border-visible);
      flex-shrink: 0;
    }

    /* === DROP ZONE === */
    .drop-zone {
      border: 2px dashed var(--border-visible);
      border-radius: var(--card-radius);
      padding: var(--space-lg) var(--space-xl);
      text-align: center;
      margin-bottom: var(--space-lg);
      transition: all 200ms ease-out;
      cursor: pointer;
      position: relative;
    }

    .drop-zone:hover, .drop-zone.drag-over {
      border-color: var(--interactive);
      background: var(--interactive-subtle);
    }

    .drop-zone-text {
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-disabled);
      line-height: 1.8;
    }

    .drop-zone-text strong {
      color: var(--text-secondary);
      font-weight: 400;
    }

    .drop-zone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }

    /* === DATA BAR === */
    .data-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-md);
      flex-wrap: wrap;
      margin-bottom: var(--space-xl);
      padding: var(--space-md) var(--space-lg);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--card-radius);
    }

    .data-stats {
      display: flex;
      gap: var(--space-lg);
      flex-wrap: wrap;
    }

    .data-stat {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-disabled);
    }

    .data-stat strong {
      color: var(--text-primary);
      font-weight: 400;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 14px;
    }

    .data-actions {
      display: flex;
      gap: var(--space-sm);
    }

    .data-btn {
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 6px 14px;
      border: 1px solid var(--border-visible);
      border-radius: 999px;
      color: var(--text-secondary);
      background: transparent;
      cursor: pointer;
      transition: all 200ms ease-out;
      white-space: nowrap;
    }

    .data-btn:hover {
      color: var(--text-display);
      border-color: var(--text-display);
    }


    /* === TOAST === */
    .toast {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--surface-raised);
      border: 1px solid var(--border-visible);
      border-radius: 8px;
      padding: 10px 20px;
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-primary);
      z-index: 3000;
      opacity: 0;
      transition: all 250ms ease-out;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* === SOURCE BADGES === */
    .card-footer-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .source-badge {
      font-family: 'Space Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 2px 6px;
      border-radius: 3px;
      white-space: nowrap;
    }

    .source-badge.fav {
      color: var(--accent);
      background: var(--accent-subtle);
    }

    .source-badge.bookmark {
      color: var(--interactive);
      background: var(--interactive-subtle);
    }

    /* === MASONRY GRID === */
    .masonry {
      display: flex;
      align-items: flex-start;
      gap: var(--col-gap);
    }

    .masonry-col {
      flex: 1 1 0;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: var(--col-gap);
    }

    /* === CARD === */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--card-radius);
      overflow: hidden;
      transition: border-color 200ms ease-out;
      width: 100%;
    }

    .card:hover {
      border-color: var(--border-visible);
    }

    .card-media {
      width: 100%;
      position: relative;
      overflow: hidden;
      background: var(--surface-raised);
    }

    .card-media img {
      width: 100%;
      display: block;
      object-fit: cover;
    }

    .card-media .video-badge {
      position: absolute;
      top: 8px;
      right: 8px;
      font-family: 'Space Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-display);
      background: rgba(0,0,0,0.7);
      padding: 3px 8px;
      border-radius: 4px;
      backdrop-filter: blur(4px);
    }

    .card-body {
      padding: var(--space-md);
    }

    .card-user {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      margin-bottom: 10px;
    }

    .card-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
      background: var(--surface-raised);
    }

    .card-user-info {
      min-width: 0;
    }

    .card-name {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-primary);
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-handle {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      color: var(--text-disabled);
      letter-spacing: 0.02em;
      line-height: 1.2;
    }

    .card-text {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 14px;
      line-height: 1.55;
      color: var(--text-primary);
      margin-bottom: 12px;
      word-break: break-word;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 8;
      -webkit-box-orient: vertical;
    }

    .card-text a {
      color: var(--interactive);
      text-decoration: none;
    }

    .card-text a:hover {
      text-decoration: underline;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-sm);
    }

    .card-date {
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-disabled);
    }

    .card-link {
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-secondary);
      text-decoration: none;
      padding: 4px 10px;
      border: 1px solid var(--border-visible);
      border-radius: 999px;
      transition: all 200ms ease-out;
      white-space: nowrap;
      background: transparent;
      cursor: pointer;
    }

    .card-link:hover {
      color: var(--text-display);
      border-color: var(--text-display);
    }

    /* === EMPTY STATE === */
    .empty-state {
      text-align: center;
      padding: var(--space-4xl) var(--space-xl);
    }

    .empty-state .label {
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-disabled);
    }

    /* === LOADING === */
    .loading {
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-secondary);
      text-align: center;
      padding: var(--space-4xl);
    }

    /* === DOT GRID BG === */
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: radial-gradient(circle, var(--border) 0.5px, transparent 0.5px);
      background-size: 24px 24px;
      pointer-events: none;
      z-index: -1;
      opacity: 0.4;
    }

    /* === SCROLL TO TOP === */
    .scroll-top {
      position: fixed;
      bottom: 32px;
      right: 32px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--surface);
      border: 1px solid var(--border-visible);
      color: var(--text-secondary);
      font-size: 18px;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      transition: all 200ms ease-out;
      z-index: 100;
    }

    .scroll-top:hover {
      border-color: var(--text-display);
      color: var(--text-display);
    }

    .scroll-top.visible {
      display: flex;
    }

    /* === MODAL === */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: var(--space-lg);
      opacity: 0;
      transition: opacity 200ms ease-out;
    }

    .modal-backdrop.open {
      display: flex;
      opacity: 1;
    }

    .modal-wrapper {
      position: relative;
      width: 100%;
      max-width: 640px;
      margin: 0 60px;
    }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border-visible);
      border-radius: 16px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
      transform: translateY(8px);
      transition: transform 200ms ease-out;
    }

    .modal-backdrop.open .modal {
      transform: translateY(0);
    }

    .modal::-webkit-scrollbar { width: 4px; }
    .modal::-webkit-scrollbar-track { background: transparent; }
    .modal::-webkit-scrollbar-thumb { background: var(--border-visible); border-radius: 2px; }

    .modal-close {
      position: sticky;
      top: 0;
      float: right;
      margin: var(--space-md) var(--space-md) 0 0;
      width: 36px;
      height: 36px;
      background: var(--surface-raised);
      border: 1px solid var(--border-visible);
      border-radius: 50%;
      color: var(--text-secondary);
      font-family: 'Space Mono', monospace;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 200ms ease-out;
      z-index: 2;
    }

    .modal-close:hover {
      color: var(--text-display);
      border-color: var(--text-display);
    }

    .modal-media { width: 100%; border-top: 1px solid var(--border); }
    .modal-media img { width: 100%; display: block; object-fit: contain; max-height: 420px; background: var(--black); }

    #modal > img {
      width: 100%; display: block; object-fit: contain; max-height: 420px;
      background: var(--black); cursor: pointer; border-top: 1px solid var(--border);
    }

    .modal-media video, #modalVideo {
      width: 100%; display: block; max-height: 480px; background: var(--black); outline: none;
    }


    .modal-media-gallery {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 2px;
    }

    .modal-media-gallery.single-col { grid-template-columns: 1fr; }

    .modal-media-gallery img {
      width: 100%; object-fit: cover; aspect-ratio: 4/3;
      cursor: pointer; transition: opacity 200ms ease-out; display: block;
    }

    .modal-media-gallery img:only-child {
      aspect-ratio: auto; max-height: 480px; object-fit: contain;
    }

    .modal-media-gallery img:hover { opacity: 0.8; }

    /* === LIGHTBOX === */
    .lightbox {
      position: fixed; inset: 0; background: rgba(0,0,0,0.95);
      z-index: 2000; display: none; align-items: center;
      justify-content: center; cursor: zoom-out;
    }

    .lightbox.open { display: flex; }
    .lightbox img { max-width: 92vw; max-height: 92vh; object-fit: contain; border-radius: 4px; }

    .lightbox-close {
      position: absolute; top: 16px; right: 16px; width: 40px; height: 40px;
      border-radius: 50%; background: var(--surface); border: 1px solid var(--border-visible);
      color: var(--text-secondary); font-family: 'Space Mono', monospace; font-size: 16px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: all 200ms ease-out;
    }

    .lightbox-close:hover { color: var(--text-display); border-color: var(--text-display); }

    /* === MODAL NAV === */
    .modal-nav {
      position: absolute; top: 50%; transform: translateY(-50%);
      width: 40px; height: 40px; border-radius: 50%; background: var(--surface);
      border: 1px solid var(--border-visible); color: var(--text-secondary);
      font-size: 16px; cursor: pointer; display: flex; align-items: center;
      justify-content: center; transition: all 200ms ease-out; z-index: 1001;
    }

    .modal-nav:hover { color: var(--text-display); border-color: var(--text-display); }
    .modal-nav.prev { left: -56px; }
    .modal-nav.next { right: -56px; }

    @media (max-width: 780px) {
      .modal-nav.prev { left: 8px; }
      .modal-nav.next { right: 8px; }
      .modal-nav { background: rgba(17,17,17,0.9); backdrop-filter: blur(4px); }
    }

    .modal-counter {
      font-family: 'Space Mono', monospace; font-size: 10px;
      letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--text-disabled); text-align: center; padding: 8px 0 0;
    }

    .modal-body { padding: var(--space-lg); }

    .modal-user { display: flex; align-items: center; gap: 12px; margin-bottom: var(--space-lg); }

    .modal-avatar {
      width: 40px; height: 40px; border-radius: 50%; object-fit: cover;
      flex-shrink: 0; background: var(--surface-raised);
    }

    .modal-user-info .modal-name {
      font-family: 'Space Grotesk', sans-serif; font-size: 15px;
      font-weight: 500; color: var(--text-display); line-height: 1.3;
    }

    .modal-user-info .modal-handle {
      font-family: 'Space Mono', monospace; font-size: 12px;
      color: var(--text-secondary); letter-spacing: 0.02em;
    }

    .modal-tweet-text {
      font-family: 'Space Grotesk', sans-serif; font-size: 16px;
      line-height: 1.65; color: var(--text-primary);
      margin-bottom: var(--space-lg); word-break: break-word;
    }

    .modal-tweet-text a { color: var(--interactive); text-decoration: none; }
    .modal-tweet-text a:hover { text-decoration: underline; }

    .modal-meta {
      display: flex; align-items: center; justify-content: space-between;
      padding-top: var(--space-md); border-top: 1px solid var(--border);
    }

    .modal-date {
      font-family: 'Space Mono', monospace; font-size: 11px;
      letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-disabled);
    }

    .modal-original-link {
      font-family: 'Space Mono', monospace; font-size: 11px;
      letter-spacing: 0.06em; text-transform: uppercase;
      color: var(--text-secondary); text-decoration: none;
      padding: 6px 16px; border: 1px solid var(--border-visible);
      border-radius: 999px; transition: all 200ms ease-out;
    }

    .modal-original-link:hover { color: var(--text-display); border-color: var(--text-display); }

    /* === TAG PILLS === */
    .tag-pill {
      font-family: 'Space Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 2px 6px;
      border-radius: 3px;
      white-space: nowrap;
      display: inline-block;
    }

    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 6px;
    }

    /* === TAG FILTER BAR === */
    .tag-filter-row {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      flex-wrap: wrap;
      margin-top: var(--space-md);
    }

    .tag-filter-row:empty { display: none; }

    /* === MODAL TAG EDITOR === */
    .modal-tags-section {
      padding: var(--space-md) var(--space-lg) var(--space-lg);
      border-top: 1px solid var(--border);
    }

    .modal-tags-label {
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-disabled);
      margin-bottom: var(--space-sm);
    }

    .modal-tags-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: var(--space-sm);
    }

    .modal-tag-pill {
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 4px 8px;
      border-radius: 4px;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: default;
    }

    .modal-tag-pill .tag-remove {
      cursor: pointer;
      opacity: 0.5;
      font-size: 12px;
      line-height: 1;
      transition: opacity 150ms;
    }

    .modal-tag-pill .tag-remove:hover { opacity: 1; }

    .modal-tag-input-wrap {
      display: flex;
      gap: var(--space-sm);
      align-items: center;
      margin-bottom: var(--space-sm);
    }

    .modal-tag-input {
      flex: 1;
      background: transparent;
      border: 1px solid var(--border-visible);

<script>
const BATCH_SIZE = 40;
const STORAGE_KEY = 'x_collection_tweets';
const TAGS_KEY = 'x_collection_tags';

let allTweets = [];
let filteredTweets = [];
let rendered = 0;
let currentFilter = 'all';
let currentSource = 'all';
let currentTags = [];
let searchQuery = '';
let loading = false;
let currentModalIndex = -1;

// ── Tag system ──
const TAG_RULES = [
  { tag: 'Design',   keywords: ['design', 'ui', 'ux', 'figma', 'typography', 'layout', 'aesthetic', 'visual', 'interface', 'prototype'] },
  { tag: 'AI',       keywords: ['ai', 'gpt', 'claude', 'llm', 'machine learning', 'neural', 'model', 'openai', 'anthropic', 'copilot', 'agent'] },
  { tag: 'Code',     keywords: ['code', 'github', 'programming', 'javascript', 'python', 'react', 'api', 'developer', 'engineering', 'typescript', 'rust', 'swift'] },
  { tag: 'Tool',     keywords: ['tool', 'app', 'plugin', 'extension', 'workflow', 'productivity', 'saas', 'cli', 'sdk'] },
  { tag: 'Creative', keywords: ['animation', 'motion', 'generative', '3d', 'shader', 'webgl', 'canvas', 'creative coding', 'p5', 'threejs', 'blender'] },
  { tag: 'Tutorial', keywords: ['tutorial', 'how to', 'guide', 'learn', 'course', 'tip', 'walkthrough', 'explained'] },
];

const TAG_COLORS = [
  { bg: 'rgba(139,92,246,0.15)',  text: '#a78bfa' },
  { bg: 'rgba(236,72,153,0.15)',  text: '#f472b6' },
  { bg: 'rgba(34,211,238,0.15)',  text: '#22d3ee' },
  { bg: 'rgba(251,191,36,0.15)',  text: '#fbbf24' },
  { bg: 'rgba(74,222,128,0.15)',  text: '#4ade80' },
  { bg: 'rgba(251,146,60,0.15)',  text: '#fb923c' },
  { bg: 'rgba(129,140,248,0.15)', text: '#818cf8' },
  { bg: 'rgba(244,114,182,0.15)', text: '#f472b6' },
  { bg: 'rgba(45,212,191,0.15)',  text: '#2dd4bf' },
  { bg: 'rgba(163,230,53,0.15)',  text: '#a3e635' },
];

function tagColor(tag) {
  let hash = 0;
  for (let i = 0; i < tag.length; i++) hash = ((hash << 5) - hash + tag.charCodeAt(i)) | 0;
  return TAG_COLORS[Math.abs(hash) % TAG_COLORS.length];
}

function autoTagTweet(tweet) {
  const text = (tweet['TweetText'] || '').toLowerCase();
  const tags = [];
  for (const rule of TAG_RULES) {
    if (rule.keywords.some(kw => text.includes(kw))) tags.push(rule.tag);
  }
  return tags;
}

function suggestTags(tweet) {
  const auto = autoTagTweet(tweet);
  const current = tweet._tags || [];
  return auto.filter(t => !current.includes(t));
}

function loadTagsMap() {
  try {
    const data = localStorage.getItem(TAGS_KEY);
    return data ? JSON.parse(data) : {};
  } catch { return {}; }
}

function saveTagsMap() {
  const map = {};
  for (const t of allTweets) {
    if (t._tags && t._tags.length > 0) map[t.TweetID] = t._tags;
  }
  try { localStorage.setItem(TAGS_KEY, JSON.stringify(map)); } catch {}
}

function hydrateTags() {
  const map = loadTagsMap();
  for (const t of allTweets) {
    if (map[t.TweetID]) {
      t._tags = map[t.TweetID];
    } else if (!t._tags || t._tags.length === 0) {
      t._tags = autoTagTweet(t);
    }
  }
}

function getAllTags() {
  const set = new Set();
  for (const t of allTweets) {
    if (t._tags) t._tags.forEach(tag => set.add(tag));
  }
  return [...set].sort();
}

function renderTagFilterRow() {
  const row = document.getElementById('tagFilterRow');
  const tags = getAllTags();
  if (tags.length === 0) { row.innerHTML = ''; return; }
  row.innerHTML = tags.map(tag => {
    const active = currentTags.includes(tag) ? ' active' : '';
    const c = tagColor(tag);
    const style = active
      ? `background:${c.bg};color:${c.text};border-color:${c.text}`
      : '';
    return `<button class="filter-tag${active}" data-tag="${escapeHTML(tag)}" style="${style}">${escapeHTML(tag)}</button>`;
  }).join('');

  row.querySelectorAll('.filter-tag').forEach(btn => {
    btn.addEventListener('click', () => {
      const tag = btn.dataset.tag;
      const idx = currentTags.indexOf(tag);
      if (idx >= 0) currentTags.splice(idx, 1);
      else currentTags.push(tag);
      renderTagFilterRow();
      applyFilters();
    });
  });
}

// ── CSV Parser ──
function parseCSV(text) {
  const lines = [];
  let current = '';
  let inQuotes = false;

  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (ch === '"') {
      if (inQuotes && text[i + 1] === '"') { current += '"'; i++; }
      else { inQuotes = !inQuotes; }
    } else if (ch === ',' && !inQuotes) {
      lines.push(current); current = '';
    } else if ((ch === '\n' || ch === '\r') && !inQuotes) {
      if (current.length > 0 || lines.length > 0) {
        lines.push(current);
        if (lines.length > 1) yield_row(lines);
        lines.length = 0; current = '';
      }
      if (ch === '\r' && text[i + 1] === '\n') i++;
    } else {
      current += ch;
    }
  }
  if (current.length > 0 || lines.length > 0) {
    lines.push(current);
    if (lines.length > 1) yield_row(lines);
  }
}

const _rows = [];
function yield_row(fields) { _rows.push([...fields]); }

function parseCSVFull(text) {
  _rows.length = 0;
  parseCSV(text);
  if (_rows.length < 2) return [];
  const headers = _rows[0].map(h => h.trim());
  return _rows.slice(1).map(fields => {
    const obj = {};
    headers.forEach((h, i) => { obj[h] = (fields[i] || '').trim(); });
    return obj;
  });
}

// ── Field Mapping: normalize any CSV format to internal schema ──
const FIELD_MAP = {
  TweetID:         ['TweetID', 'id', 'tweet_id', 'rest_id', 'ID'],
  TwitterUserID:   ['TwitterUserID', 'user_id', 'author_id'],
  UserScreenName:  ['UserScreenName', 'screen_name', 'username', 'handle'],
  UserProfileName: ['UserProfileName', 'name', 'display_name', 'user_name'],
  UserProfilePic:  ['UserProfilePic', 'profile_image_url', 'avatar_url', 'profile_image_url_https'],
  TweetText:       ['TweetText', 'full_text', 'text', 'content', 'tweet_text'],
  'Tweet Url':     ['Tweet Url', 'tweet_url', 'url', 'link', 'permalink'],
  TweetCreatedDate:['TweetCreatedDate', 'created_at', 'date', 'timestamp', 'tweeted_at'],
  MediaType:       ['MediaType', 'media_type', 'type'],
  MediaImageUrl:   ['MediaImageUrl', 'media_url', 'image_url', 'media_image_url', 'photos'],
  MediaVideoUrl:   ['MediaVideoUrl', 'video_url', 'media_video_url'],
  HasLink:         ['HasLink', 'has_link', 'has_url'],
};

function normalizeTweet(raw) {
  const out = {};
  for (const [canonical, aliases] of Object.entries(FIELD_MAP)) {
    out[canonical] = '';
    for (const alias of aliases) {
      if (raw[alias] != null && raw[alias] !== '') {
        out[canonical] = String(raw[alias]).trim();
        break;
      }
    }
  }

  if (!out.TweetID && out['Tweet Url']) {
    const m = out['Tweet Url'].match(/status\/(\d+)/);
    if (m) out.TweetID = m[1];
  }

  if (!out['Tweet Url'] && out.TweetID && out.UserScreenName) {
    out['Tweet Url'] = `https://twitter.com/${out.UserScreenName}/status/${out.TweetID}`;
  }

  // twitter-web-exporter: parse the `media` JSON column for MediaType/Image/Video
  if ((!out.MediaType || !out.MediaImageUrl) && raw.media && raw.media !== '[]') {
    try {
      const mediaArr = typeof raw.media === 'string' ? JSON.parse(raw.media) : raw.media;
      if (Array.isArray(mediaArr) && mediaArr.length > 0) {
        const photos = mediaArr.filter(m => m.type === 'photo');
        const videos = mediaArr.filter(m => m.type === 'video' || m.type === 'animated_gif');

        if (videos.length > 0) {
          out.MediaType = 'video';
          out.MediaImageUrl = videos[0].thumbnail || videos[0].original || '';
          out.MediaVideoUrl = videos[0].original || '';
        } else if (photos.length > 0) {
          out.MediaType = 'photo';
          out.MediaImageUrl = photos.map(p => p.original || p.url || '').join(',');
        }
      }
    } catch (e) { /* not valid JSON, skip */ }
  }

  if (out.HasLink === '') {
    const text = out.TweetText || '';
    const hasTcoLink = /https?:\/\/t\.co\/\S+/.test(text);
    out.HasLink = hasTcoLink ? 'True' : 'False';
  }

  return out;
}

function guessSource(filename) {
  const lower = (filename || '').toLowerCase();
  if (lower.includes('bookmark') || lower.includes('save') || lower.includes('书签')) return 'bookmark';
  if (lower.includes('like') || lower.includes('fav') || lower.includes('喜欢') || lower.includes('赞')) return 'favourite';
  return 'favourite';
}

// ── localStorage persistence ──
function saveToStorage() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(allTweets));
  } catch (e) {
    console.warn('Storage full, data not saved');
  }
}

function loadFromStorage() {
  try {
    const data = localStorage.getItem(STORAGE_KEY);
    return data ? JSON.parse(data) : [];
  } catch (e) {
    return [];
  }
}

function clearStorage() {
  localStorage.removeItem(STORAGE_KEY);
}

// ── Merge & deduplicate ──
function mergeTweets(existing, incoming) {
  const seen = new Set();
  const result = [];
  for (const t of existing) {
    if (t.TweetID && !seen.has(t.TweetID)) {
      seen.add(t.TweetID);
      result.push(t);
    }
  }
  let added = 0;
  for (const t of incoming) {
    if (t.TweetID && !seen.has(t.TweetID)) {
      seen.add(t.TweetID);
      result.push(t);
      added++;
    }
  }
  result.sort((a, b) => new Date(b.TweetCreatedDate) - new Date(a.TweetCreatedDate));
  return { merged: result, added };
}

// ── Import CSV files ──
function importCSVText(text, source) {
  const raw = parseCSVFull(text);
  return raw.map(r => {
    const t = normalizeTweet(r);
    t._source = t._source || source;
    return t;
  }).filter(t => t.TweetID);
}

function handleFiles(files) {
  let totalAdded = 0;
  let processed = 0;

  for (const file of files) {
    const reader = new FileReader();
    reader.onload = function(e) {
      const text = e.target.result;
      const source = guessSource(file.name);
      let tweets;

      if (file.name.endsWith('.json')) {
        try {
          const data = JSON.parse(text);
          const arr = Array.isArray(data) ? data : (data.tweets || data.data || [data]);
          tweets = arr.map(r => {
            const t = normalizeTweet(r);
            t._source = source;
            return t;
          }).filter(t => t.TweetID);
        } catch (err) {
          tweets = [];
        }
      } else {
        tweets = importCSVText(text, source);
      }

      tweets.forEach(t => { if (!t._tags || !t._tags.length) t._tags = autoTagTweet(t); });
      const { merged, added } = mergeTweets(allTweets, tweets);
      allTweets = merged;
      totalAdded += added;
      processed++;

      if (processed === files.length) {
        saveToStorage();
        saveTagsMap();
        renderTagFilterRow();
        applyFilters();
        updateDataBar();
        showToast(`+${totalAdded} NEW TWEETS IMPORTED`);
      }
    };
    reader.readAsText(file);
  }
}

// ── Export combined CSV ──
function exportAllCSV() {
  const headers = Object.keys(FIELD_MAP);
  const csvRows = [headers.join(',')];

  for (const t of allTweets) {
    const row = headers.map(h => {
      const val = t[h] || '';
      if (val.includes(',') || val.includes('"') || val.includes('\n')) {
        return '"' + val.replace(/"/g, '""') + '"';
      }
      return val;
    });
    csvRows.push(row.join(','));
  }

  const csv = csvRows.join('\n');
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `Twitter_Collection_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  showToast(`EXPORTED ${allTweets.length} TWEETS`);
}

// ── UI Helpers ──
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._timer);
  el._timer = setTimeout(() => el.classList.remove('show'), 2500);
}

function updateDataBar() {
  const bar = document.getElementById('dataBar');
  if (allTweets.length === 0) {
    bar.style.display = 'none';
    return;
  }
  bar.style.display = '';
  const likes = allTweets.filter(t => t._source === 'favourite').length;
  const bookmarks = allTweets.filter(t => t._source === 'bookmark').length;
  document.getElementById('statLikes').textContent = likes;
  document.getElementById('statBookmarks').textContent = bookmarks;
  document.getElementById('statTotal').textContent = allTweets.length;
}

// Convert literal escaped newlines (backslash-n / backslash-r) from CSV into real newlines
function normalizeNewlines(text) {
  return text
    .replace(/\\r\\n|\\n|\\r/g, '\n')
    .replace(/\n{3,}/g, '\n\n');
}

function cleanText(text) {
  return text
    .replace(/\\r\\n|\\n|\\r/g, ' ')
    .replace(/https?:\/\/t\.co\/\S+/g, '')
    .replace(/\s+/g, ' ')
    .trim();
}

function formatDate(dateStr) {
  if (!dateStr) return '';
  try {
    const d = new Date(dateStr);
    if (isNaN(d)) return dateStr;
    const months = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
    return `${months[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
  } catch { return dateStr; }
}

function getFirstImage(urls) {
  if (!urls) return null;
  return urls.split(',')[0].trim() || null;
}

function linkifyText(text) {
  return text.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
}

function escapeHTML(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ── Card rendering ──
function createCard(tweet, index) {
  const card = document.createElement('div');
  card.className = 'card';
  card.style.animationDelay = `${(index % BATCH_SIZE) * 30}ms`;

  const mediaType = tweet['MediaType'] || '';
  const imageUrl = getFirstImage(tweet['MediaImageUrl']);
  const displayText = cleanText(tweet['TweetText'] || '');
  const profilePic = (tweet['UserProfilePic'] || '').replace('_normal', '_bigger');
  const profileName = tweet['UserProfileName'] || '';
  const screenName = tweet['UserScreenName'] || '';
  const date = formatDate(tweet['TweetCreatedDate']);

  let html = '';

  if (imageUrl) {
    html += `<div class="card-media">
      <img src="${imageUrl}" alt="" loading="lazy" onerror="this.parentElement.remove()">
      ${mediaType.toLowerCase() === 'video' ? '<span class="video-badge">▶ VIDEO</span>' : ''}
    </div>`;
  }

  html += `<div class="card-body">`;
  html += `<div class="card-user">
    <img class="card-avatar" src="${profilePic}" alt="" loading="lazy" onerror="this.style.display='none'">
    <div class="card-user-info">
      <div class="card-name">${escapeHTML(profileName)}</div>
      <div class="card-handle">@${escapeHTML(screenName)}</div>
    </div>
  </div>`;

  if (displayText) {
    html += `<div class="card-text">${linkifyText(escapeHTML(displayText))}</div>`;
  }

  const srcCls = tweet._source === 'bookmark' ? 'bookmark' : 'fav';
  const srcLbl = tweet._source === 'bookmark' ? '★ SAVE' : '♥ LIKE';
  const tags = tweet._tags || [];
  const tagPills = tags.map(t => {
    const c = tagColor(t);
    return `<span class="tag-pill" style="background:${c.bg};color:${c.text}">${escapeHTML(t)}</span>`;
  }).join('');

  html += `<div class="card-footer">
    <div class="card-footer-meta">
      <span class="card-date">${date}</span>
      <span class="source-badge ${srcCls}">${srcLbl}</span>
    </div>
    <button class="card-link" data-idx="${index}">VIEW →</button>
  </div>`;
  if (tagPills) html += `<div class="card-tags">${tagPills}</div>`;

  html += `</div>`;
  card.innerHTML = html;

  card.querySelector('.card-link').addEventListener('click', (e) => {
    e.stopPropagation();
    openModalAt(index);
  });

  return card;
}

// ── Masonry column management ──
function getColumnCount() {
  const w = window.innerWidth;
  if (w <= 480) return 1;
  if (w <= 820) return 2;
  if (w <= 1200) return 3;
  return 4;
}

let _currentColumnCount = 0;

function ensureColumns(force) {
  const masonry = document.getElementById('masonry');
  const desired = getColumnCount();
  if (!force && desired === _currentColumnCount && masonry.querySelector('.masonry-col')) return false;
  masonry.innerHTML = '';
  for (let i = 0; i < desired; i++) {
    const col = document.createElement('div');
    col.className = 'masonry-col';
    masonry.appendChild(col);
  }
  _currentColumnCount = desired;
  return true;
}

function getShortestColumn() {
  const cols = document.querySelectorAll('#masonry .masonry-col');
  if (cols.length === 0) return null;
  let shortest = cols[0];
  let minHeight = shortest.offsetHeight;
  for (let i = 1; i < cols.length; i++) {
    const h = cols[i].offsetHeight;
    if (h < minHeight) {
      minHeight = h;
      shortest = cols[i];
    }
  }
  return shortest;
}

// ── Filtering ──
function applyFilters() {
  const q = searchQuery.toLowerCase();
  filteredTweets = allTweets.filter(t => {
    const mediaType = (t['MediaType'] || '').toLowerCase();
    const hasLink = t['HasLink'] === 'True';
    const textOnly = !mediaType && !hasLink;

    if (currentFilter === 'photo' && mediaType !== 'photo') return false;
    if (currentFilter === 'video' && mediaType !== 'video') return false;
    if (currentFilter === 'text' && !textOnly) return false;
    if (currentFilter === 'link' && !hasLink) return false;
    if (currentSource !== 'all' && t._source !== currentSource) return false;

    if (currentTags.length > 0) {
      const tweetTags = t._tags || [];
      if (!currentTags.some(tag => tweetTags.includes(tag))) return false;
    }

    if (q) {
      const text = (t['TweetText'] || '').toLowerCase();
      const name = (t['UserProfileName'] || '').toLowerCase();
      const handle = (t['UserScreenName'] || '').toLowerCase();
      if (!text.includes(q) && !name.includes(q) && !handle.includes(q)) return false;
    }

    return true;
  });

  document.getElementById('countDisplay').textContent = filteredTweets.length;
  rendered = 0;
  ensureColumns(true);
  renderBatch();
}

function renderBatch() {
  const masonry = document.getElementById('masonry');

  if (filteredTweets.length === 0) {
    masonry.innerHTML = '<div class="empty-state"><div class="label">[NO RESULTS]</div></div>';
    _currentColumnCount = 0;
    rendered = 0;
    loading = false;
    return;
  }

  if (rendered >= filteredTweets.length || loading) return;
  loading = true;

  ensureColumns();

  const end = Math.min(rendered + BATCH_SIZE, filteredTweets.length);

  for (let i = rendered; i < end; i++) {
    const card = createCard(filteredTweets[i], i);
    const target = getShortestColumn();
    if (target) target.appendChild(card);
    else masonry.appendChild(card);
  }

  rendered = end;
  loading = false;
}

// ── Re-distribute existing cards on viewport resize when column count changes ──
let _resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(_resizeTimer);
  _resizeTimer = setTimeout(() => {
    const desired = getColumnCount();
    if (desired === _currentColumnCount) return;
    const previouslyRendered = rendered;
    rendered = 0;
    ensureColumns(true);
    while (rendered < previouslyRendered && rendered < filteredTweets.length) {
      renderBatch();
    }
  }, 150);
}, { passive: true });

// ── Modal ──
function openModalAt(index) {
  if (index < 0 || index >= filteredTweets.length) return;
  currentModalIndex = index;
  const tweet = filteredTweets[index];

  const backdrop = document.getElementById('modalBackdrop');
  const content = document.getElementById('modalContent');
  const counter = document.getElementById('modalCounter');

  stopModalVideo();

  const mediaType = (tweet['MediaType'] || '').toLowerCase();
  const imageUrls = (tweet['MediaImageUrl'] || '').split(',').map(u => u.trim()).filter(Boolean);
  const videoUrl = tweet['MediaVideoUrl'] || '';
  const tweetUrl = tweet['Tweet Url'] || '';
  const fullText = tweet['TweetText'] || '';
  const profilePic = (tweet['UserProfilePic'] || '').replace('_normal', '_200x200');
  const profileName = tweet['UserProfileName'] || '';
  const screenName = tweet['UserScreenName'] || '';
  const date = formatDate(tweet['TweetCreatedDate']);
  const srcCls = tweet._source === 'bookmark' ? 'bookmark' : 'fav';
  const srcLbl = tweet._source === 'bookmark' ? '★ SAVE' : '♥ LIKE';

  let mediaHTML = '';
  if (mediaType === 'video' && videoUrl) {
    // appended directly below
  } else if (imageUrls.length > 1) {
    mediaHTML = `<div class="modal-media modal-media-gallery">
      ${imageUrls.map(u => `<img src="${u}" alt="" data-full="${u}" loading="lazy">`).join('')}
    </div>`;
  }

  const linkedText = linkifyText(escapeHTML(normalizeNewlines(fullText))).replace(/\n/g, '<br>');

  content.innerHTML = `
    <div class="modal-body">
      <div class="modal-user">
        <img class="modal-avatar" src="${profilePic}" alt="" onerror="this.style.display='none'">
        <div class="modal-user-info">
          <div class="modal-name">${escapeHTML(profileName)}</div>
          <div class="modal-handle">@${escapeHTML(screenName)}</div>
        </div>
      </div>
      <div class="modal-tweet-text">${linkedText}</div>
      <div class="modal-meta">
        <div class="card-footer-meta">
          <span class="modal-date">${date}</span>
          <span class="source-badge ${srcCls}">${srcLbl}</span>
        </div>
        ${tweetUrl ? `<a class="modal-original-link" href="${tweetUrl}" target="_blank" rel="noopener">OPEN ORIGINAL →</a>` : ''}
      </div>
    </div>
    <div class="modal-tags-section" id="modalTagsSection"></div>
    ${mediaHTML}`;

  renderModalTags(tweet);

  counter.textContent = `${index + 1} / ${filteredTweets.length}`;

  const existingVideo = document.getElementById('modalVideo');
  if (existingVideo) existingVideo.remove();
  const existingImg = document.querySelector('#modal > img');
  if (existingImg) existingImg.remove();

  if (mediaType === 'video' && videoUrl) {
    const modal = document.getElementById('modal');
    const video = document.createElement('video');
    video.id = 'modalVideo';
    video.controls = true;
    video.playsInline = true;
    video.muted = true;
    video.autoplay = true;
    video.loop = true;
    video.preload = 'auto';
    video.referrerPolicy = 'no-referrer';
    if (imageUrls[0]) video.poster = imageUrls[0];

    function tryBlobPlayback() {
      fetch(videoUrl, { referrerPolicy: 'no-referrer', mode: 'cors' })
        .then(r => { if (!r.ok) throw new Error(r.status); return r.blob(); })
        .then(blob => {
          video.src = URL.createObjectURL(blob);
          video.muted = true;
          video.play().catch(() => {});
        })
        .catch(() => {});
    }

    video.innerHTML = `<source src="${videoUrl}" type="video/mp4">`;
    video.addEventListener('error', function onSourceError() {
      video.removeEventListener('error', onSourceError);
      tryBlobPlayback();
    }, true);
    modal.appendChild(video);
  } else if (imageUrls.length === 1) {
    const modal = document.getElementById('modal');
    const img = document.createElement('img');
    img.src = imageUrls[0];
    img.alt = '';
    img.dataset.full = imageUrls[0];
    img.loading = 'lazy';
    img.style.cursor = 'pointer';
    img.addEventListener('click', () => openLightbox(img.dataset.full));
    modal.appendChild(img);
  }

  content.querySelectorAll('.modal-media img[data-full]').forEach(img => {
    img.addEventListener('click', () => openLightbox(img.dataset.full));
  });

  backdrop.classList.add('open');
  document.body.style.overflow = 'hidden';

  const modalVid = document.getElementById('modalVideo');
  if (modalVid && modalVid.tagName === 'VIDEO') { modalVid.muted = true; modalVid.play().catch(() => {}); }
  document.getElementById('modal').scrollTop = 0;
}

function navigateModal(dir) {
  const next = currentModalIndex + dir;
  if (next >= 0 && next < filteredTweets.length) openModalAt(next);
}

function stopModalVideo() {
  const el = document.getElementById('modalVideo');
  if (!el) return;
  if (el.tagName === 'VIDEO') { el.pause(); el.removeAttribute('src'); el.load(); }
  el.remove();
}

function closeModal() {
  stopModalVideo();
  const img = document.querySelector('#modal > img');
  if (img) img.remove();
  document.getElementById('modalBackdrop').classList.remove('open');
  document.body.style.overflow = '';
  currentModalIndex = -1;
}

function renderModalTags(tweet) {
  const section = document.getElementById('modalTagsSection');
  if (!section) return;
  const tags = tweet._tags || [];
  const suggestions = suggestTags(tweet);

  const pillsHTML = tags.map(t => {
    const c = tagColor(t);
    return `<span class="modal-tag-pill" style="background:${c.bg};color:${c.text}" data-tag="${escapeHTML(t)}">${escapeHTML(t)}<span class="tag-remove">✕</span></span>`;
  }).join('');

  const suggestHTML = suggestions.map(t =>
    `<button class="modal-tag-suggest" data-tag="${escapeHTML(t)}">+ ${escapeHTML(t)}</button>`
  ).join('');

  section.innerHTML = `
    <div class="modal-tags-label">Tags</div>
    <div class="modal-tags-list">${pillsHTML || '<span style="font-size:10px;color:var(--text-disabled);font-family:\'Space Mono\',monospace;letter-spacing:0.04em">NO TAGS</span>'}</div>
    <div class="modal-tag-input-wrap">
      <input class="modal-tag-input" id="modalTagInput" placeholder="Add tag..." maxlength="30">
    </div>
    ${suggestHTML ? `<div class="modal-tag-suggestions">${suggestHTML}</div>` : ''}`;

  section.querySelectorAll('.tag-remove').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const tag = btn.parentElement.dataset.tag;
      tweet._tags = (tweet._tags || []).filter(t => t !== tag);
      saveTagsMap();
      renderModalTags(tweet);
      renderTagFilterRow();
    });
  });

  section.querySelectorAll('.modal-tag-suggest').forEach(btn => {
    btn.addEventListener('click', () => {
      const tag = btn.dataset.tag;
      if (!tweet._tags) tweet._tags = [];
      if (!tweet._tags.includes(tag)) tweet._tags.push(tag);
      saveTagsMap();
      renderModalTags(tweet);
      renderTagFilterRow();
    });
  });

  const input = document.getElementById('modalTagInput');
  input.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    const val = input.value.trim();
    if (!val) return;
    const tag = val.charAt(0).toUpperCase() + val.slice(1);
    if (!tweet._tags) tweet._tags = [];
    if (!tweet._tags.includes(tag)) {
      tweet._tags.push(tag);
      saveTagsMap();
      renderModalTags(tweet);
      renderTagFilterRow();
    }
    input.value = '';
  });
}

function openLightbox(src) {
  document.getElementById('lightboxImg').src = src;
  document.getElementById('lightbox').classList.add('open');
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightboxImg').src = '';
}

// ── Event listeners ──
document.getElementById('modalClose').addEventListener('click', closeModal);
document.getElementById('modalPrev').addEventListener('click', (e) => { e.stopPropagation(); navigateModal(-1); });
document.getElementById('modalNext').addEventListener('click', (e) => { e.stopPropagation(); navigateModal(1); });
document.getElementById('modalBackdrop').addEventListener('click', (e) => {
  if (e.target === e.currentTarget || e.target.classList.contains('modal-wrapper')) closeModal();
});
document.getElementById('lightbox').addEventListener('click', (e) => {
  if (e.target !== document.getElementById('lightboxImg')) closeLightbox();
});
document.querySelector('.lightbox-close').addEventListener('click', closeLightbox);

document.addEventListener('keydown', (e) => {
  if (document.getElementById('lightbox').classList.contains('open')) {
    if (e.key === 'Escape') closeLightbox();
    return;
  }
  if (!document.getElementById('modalBackdrop').classList.contains('open')) return;
  if (e.key === 'Escape') closeModal();
  else if (e.key === 'ArrowLeft') navigateModal(-1);
  else if (e.key === 'ArrowRight') navigateModal(1);
});

document.getElementById('scrollTop').addEventListener('click', () => {
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

document.getElementById('searchInput').addEventListener('input', (e) => {
  searchQuery = e.target.value;
  applyFilters();
});

document.querySelectorAll('#typeTags .filter-tag').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#typeTags .filter-tag').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    applyFilters();
  });
});

document.querySelectorAll('#sourceTags .filter-tag').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#sourceTags .filter-tag').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentSource = btn.dataset.source;
    applyFilters();
  });
});

window.addEventListener('scroll', function onScroll() {
  const st = document.getElementById('scrollTop');
  if (window.scrollY > 600) st.classList.add('visible');
  else st.classList.remove('visible');
  if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 800) renderBatch();
}, { passive: true });

// ── Drop zone ──
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');

['dragenter', 'dragover'].forEach(ev => {
  dropZone.addEventListener(ev, (e) => { e.preventDefault(); dropZone.classList.add('drag-over'); });
});
['dragleave', 'drop'].forEach(ev => {
  dropZone.addEventListener(ev, (e) => { e.preventDefault(); dropZone.classList.remove('drag-over'); });
});

dropZone.addEventListener('drop', (e) => {
  const files = e.dataTransfer.files;
  if (files.length > 0) handleFiles(files);
});

fileInput.addEventListener('change', () => {
  if (fileInput.files.length > 0) handleFiles(fileInput.files);
  fileInput.value = '';
});

// ── Data management buttons ──
document.getElementById('btnExport').addEventListener('click', exportAllCSV);

// ── Full-page drag support ──
document.body.addEventListener('dragover', (e) => { e.preventDefault(); });
document.body.addEventListener('drop', (e) => {
  e.preventDefault();
  const files = e.dataTransfer.files;
  if (files.length > 0) handleFiles(files);
});

// ── Init: load from localStorage, then load all CSV files listed in csv-list.json ──
(async function init() {
  allTweets = loadFromStorage();

  try {
    const listResp = await fetch('csv-list.json');
    const csvFiles = listResp.ok ? await listResp.json() : [];

    const texts = await Promise.all(
      csvFiles.map(name =>
        fetch(name).then(r => r.ok ? r.text() : '').catch(() => '')
      )
    );

    const csvTweets = texts.flatMap((text, i) => {
      const source = guessSource(csvFiles[i]);
      return importCSVText(text, source);
    });

    if (csvTweets.length > 0) {
      const { merged, added } = mergeTweets(allTweets, csvTweets);
      allTweets = merged;
      if (added > 0) saveToStorage();
    }
  } catch (e) { /* CSV files not available, that's fine */ }

  hydrateTags();
  saveTagsMap();
  renderTagFilterRow();

  document.getElementById('countDisplay').textContent = allTweets.length;
  filteredTweets = allTweets;
  ensureColumns(true);
  renderBatch();
  updateDataBar();
})();
</script>
