  if (media.tagName === 'VIDEO') {
    const src = media.dataset.viewerSrc || media.dataset.src || media.currentSrc || media.src;
    if (!src) return null;
    return {
      type: 'video',
      src,
      poster: media.dataset.viewerPoster || media.poster || '',
      alt: media.getAttribute('aria-label') || '视频'
    };
  }
  if (media.tagName === 'IMG' && !media.classList.contains('card-video-fallback')) {
    const src = media.dataset.full || media.currentSrc || media.src;
    if (!src) return null;
    return {
      type: 'image',
      src,
      poster: media.currentSrc || media.src || src,
      alt: media.alt || '图片'
    };
  }
  return null;
}

function getViewerCollection(media) {
  const article = media.closest('.x-article');
  const group = article
    || media.closest('.card-media-track, .digest-media-track, .embedded-post-media, .modal-media-gallery, .card-media, .modal-media');
  const elements = group
    ? [...group.querySelectorAll('img[data-full], video[data-viewer-src], video.card-video[data-src], #modalVideo')]
    : [media];
  const items = [];
  let index = 0;
  const seen = new Set();

  elements.forEach(element => {
    const item = mediaItemFromElement(element);
    if (!item) return;
    const key = `${item.type}:${item.src}`;
    if (seen.has(key)) return;
    seen.add(key);
    if (element === media) index = items.length;
    items.push(item);
  });

  if (!items.length) {
    const fallback = mediaItemFromElement(media);
    if (fallback) items.push(fallback);
  }
  return { items, index: Math.min(index, Math.max(items.length - 1, 0)) };
}

function normalizeViewerItems(items) {
  const source = typeof items === 'string' ? [{ type: 'image', src: items }] : (Array.isArray(items) ? items : [items]);
  const seen = new Set();
  return source.map(item => typeof item === 'string' ? { type: 'image', src: item } : item)
    .filter(item => item && item.src)
    .map(item => ({
      type: item.type === 'video' ? 'video' : 'image',
      src: item.type === 'video' ? item.src : highResMediaUrl(item.src, true),
      poster: item.poster ? highResMediaUrl(item.poster, true) : '',
      alt: item.alt || (item.type === 'video' ? '视频' : '图片')
    }))
    .filter(item => {
      const key = `${item.type}:${item.src}`;
      if (seen.has(key)) return false;
      seen.add(key);
      return true;
    });
}

function fitLightboxMediaElement(media) {
  const stage = media?.closest('.lightbox-stage');
  if (!stage) return;
  const naturalWidth = media.tagName === 'VIDEO' ? media.videoWidth : media.naturalWidth;
  const naturalHeight = media.tagName === 'VIDEO' ? media.videoHeight : media.naturalHeight;
  if (!naturalWidth || !naturalHeight || !stage.clientWidth || !stage.clientHeight) return;
  const scale = Math.min(stage.clientWidth / naturalWidth, stage.clientHeight / naturalHeight);
  media.style.width = `${Math.max(1, naturalWidth * scale)}px`;
  media.style.height = `${Math.max(1, naturalHeight * scale)}px`;
}

function fitLightboxMedia() {
  document.querySelectorAll('#lightboxTrack .lightbox-media').forEach(fitLightboxMediaElement);
}

function renderLightboxItems() {
  const track = document.getElementById('lightboxTrack');
  const thumbs = document.getElementById('lightboxThumbs');
  track.innerHTML = lightboxState.items.map((item, index) => {
    const label = `${item.alt || (item.type === 'video' ? '视频' : '图片')} ${index + 1} / ${lightboxState.items.length}`;
    if (item.type === 'video') {
      return `<div class="lightbox-slide" id="lightboxSlide-${index}" role="tabpanel" aria-label="${escapeHTML(label)}">
        <video class="lightbox-media" src="${escapeHTML(item.src)}"${item.poster ? ` poster="${escapeHTML(item.poster)}"` : ''} crossorigin="anonymous" loop playsinline webkit-playsinline disablepictureinpicture disableremoteplayback controlslist="nodownload nofullscreen noremoteplayback" x-webkit-airplay="deny" preload="metadata" aria-label="${escapeHTML(label)}"></video>
      </div>`;
    }
    return `<div class="lightbox-slide" id="lightboxSlide-${index}" role="tabpanel" aria-label="${escapeHTML(label)}">
      <img class="lightbox-media" src="${escapeHTML(item.src)}" alt="${escapeHTML(label)}" crossorigin="anonymous" draggable="false">
    </div>`;
  }).join('');
  [...track.children].forEach((slide, index) => setMediaBackdrop(slide, lightboxState.items[index]));
  track.querySelectorAll('.lightbox-media').forEach(media => {
    const eventName = media.tagName === 'VIDEO' ? 'loadedmetadata' : 'load';
    media.addEventListener(eventName, () => fitLightboxMediaElement(media), { once: true });
    fitLightboxMediaElement(media);
  });

  thumbs.innerHTML = lightboxState.items.map((item, index) => {
    const preview = item.poster || (item.type === 'image' ? item.src : '');
    return `<button class="lightbox-thumb" type="button" role="tab" aria-controls="lightboxSlide-${index}" aria-label="查看第 ${index + 1} 项" data-index="${index}">
      ${preview ? `<img src="${escapeHTML(preview)}" alt="" draggable="false">` : '<span class="lightbox-thumb-placeholder" aria-hidden="true">▶</span>'}
      ${item.type === 'video' ? '<span class="lightbox-thumb-video" aria-hidden="true">▶</span>' : ''}
    </button>`;
  }).join('');
  thumbs.classList.toggle('single', lightboxState.items.length <= 1);
  thumbs.querySelectorAll('.lightbox-thumb').forEach(button => {
    button.addEventListener('click', () => setLightboxIndex(Number(button.dataset.index)));
  });
}

function renderLightboxSource() {
  const button = document.getElementById('lightboxSource');
  const source = lightboxState.source;
  if (!source?.tweet) {
    button.hidden = true;
    return;
  }

  const tweet = source.tweet;
  const name = tweet.UserProfileName || tweet.UserScreenName || 'X 用户';
  const handle = tweet.UserScreenName ? `@${tweet.UserScreenName}` : '';
  const date = formatDate(tweet.TweetCreatedDate || '');
  const fullText = cleanText(tweet.TweetText || '') || '查看这条素材对应的站内原帖';
  const text = fullText.length > 88 ? `${fullText.slice(0, 88).trimEnd()}…` : fullText;
  const avatar = tweet.UserProfilePic || '';
  const avatarElement = document.getElementById('lightboxSourceAvatar');
  avatarElement.hidden = false;
  avatarElement.style.visibility = avatar ? 'visible' : 'hidden';
  if (avatar) avatarElement.src = avatar;
  else avatarElement.removeAttribute('src');
  avatarElement.onload = () => { avatarElement.style.visibility = 'visible'; };
  avatarElement.onerror = () => { avatarElement.style.visibility = 'hidden'; };
  document.getElementById('lightboxSourceName').textContent = name;
  document.getElementById('lightboxSourceHandle').textContent = handle;
  document.getElementById('lightboxSourceDate').textContent = date;
  document.getElementById('lightboxSourceText').textContent = text;
  button.setAttribute('aria-label', `查看站内原帖：${name} ${text}`);
  button.hidden = false;
}

function updateLightboxUnlikeControl() {
  const button = document.getElementById('lightboxUnlike');
  button.hidden = !isTweetLiked(lightboxState.source?.tweet);
}

function updateLightboxSoundControl() {
  const button = document.getElementById('lightboxSound');
  const activeItem = lightboxState.items[lightboxState.index];
  const isVideo = activeItem?.type === 'video';
  button.hidden = !isVideo;
  button.classList.toggle('muted', lightboxState.audioMuted);
  button.setAttribute('aria-pressed', lightboxState.audioMuted ? 'true' : 'false');
  button.setAttribute('aria-label', lightboxState.audioMuted ? '开启视频声音' : '静音视频');
}

function syncLightboxPlayback() {
  const slides = [...document.querySelectorAll('#lightboxTrack .lightbox-slide')];
  slides.forEach((slide, index) => {
    const video = slide.querySelector('video');
    if (!video) return;
    video.controls = false;
    video.playsInline = true;
    video.disablePictureInPicture = true;
    video.disableRemotePlayback = true;
    if (index === lightboxState.index) {
      video.muted = lightboxState.audioMuted;
      const playAttempt = video.play();
      if (playAttempt?.catch) {
        playAttempt.catch(() => {
          if (video !== slides[lightboxState.index]?.querySelector('video')) return;
          lightboxState.audioMuted = true;
          video.muted = true;
          updateLightboxSoundControl();
          video.play().catch(() => {});
        });
      }
    } else {
      video.pause();
    }
  });
  updateLightboxSoundControl();
}

function toggleLightboxSound() {
  const activeItem = lightboxState.items[lightboxState.index];
  if (activeItem?.type !== 'video') return;
  lightboxState.audioMuted = !lightboxState.audioMuted;
  const activeVideo = document.querySelectorAll('#lightboxTrack .lightbox-slide')[lightboxState.index]?.querySelector('video');
  if (activeVideo) {
    activeVideo.muted = lightboxState.audioMuted;
    if (!lightboxState.audioMuted) {
      activeVideo.play().catch(() => {
        lightboxState.audioMuted = true;
        activeVideo.muted = true;
        updateLightboxSoundControl();
      });
    }
  }
  updateLightboxSoundControl();
}

function setLightboxIndex(index, scrollThumb = true) {
  if (!lightboxState.items.length) return;
  const next = Math.max(0, Math.min(index, lightboxState.items.length - 1));
  lightboxState.index = next;
  const lightbox = document.getElementById('lightbox');
  lightbox.style.setProperty('--viewer-offset', `${next * -100}%`);
  lightbox.style.setProperty('--viewer-dx', '0px');
  const activeItem = lightboxState.items[next];
  const backdrop = activeItem?.poster || (activeItem?.type === 'image' ? activeItem.src : '');
  lightbox.style.setProperty('--viewer-backdrop', backdrop ? `url(${JSON.stringify(backdrop)})` : 'none');

  document.querySelectorAll('#lightboxTrack .lightbox-slide').forEach((slide, slideIndex) => {
    slide.setAttribute('aria-hidden', slideIndex === next ? 'false' : 'true');
  });
  document.querySelectorAll('#lightboxThumbs .lightbox-thumb').forEach((thumb, thumbIndex) => {
    const active = thumbIndex === next;
    thumb.setAttribute('aria-selected', active ? 'true' : 'false');
    thumb.tabIndex = active ? 0 : -1;
    if (active && scrollThumb && lightboxState.items.length > 1) {
      thumb.scrollIntoView({
        block: 'nearest',
        inline: 'center',
        behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'
      });
    }
  });

  const materialSequence = lightboxState.context === 'material-grid';
  document.getElementById('lightboxCount').textContent = materialSequence
    ? `${lightboxState.sequenceIndex + 1} / ${lightboxState.sequenceLength}`
    : `${next + 1} / ${lightboxState.items.length}`;
  document.getElementById('lightboxHint').textContent = materialSequence
    ? (lightboxState.items.length > 1 ? '左右换组内素材 · 上下换素材' : '上下换素材')
    : (lightboxState.items.length > 1 ? '左右切换 · 上下滑动退出' : '上下滑动退出');
  document.getElementById('lightboxPrev').disabled = next === 0;
  document.getElementById('lightboxNext').disabled = next === lightboxState.items.length - 1;
  syncLightboxPlayback();
}

function resetLightboxDrag() {
  const lightbox = document.getElementById('lightbox');
  lightbox.classList.remove('dragging', 'dismissing', 'sequence-leaving', 'sequence-reset', 'sequence-entering');
  lightbox.style.setProperty('--viewer-dx', '0px');
  lightbox.style.setProperty('--viewer-shell-x', '0px');
  lightbox.style.setProperty('--viewer-y', '0px');
  lightbox.style.setProperty('--viewer-scale', '1');
  lightbox.style.setProperty('--viewer-content-opacity', '1');
  lightbox.style.setProperty('--viewer-bg-alpha', '0.56');
}

function setLightboxHorizontalDrag(dx) {
  const atStart = lightboxState.index === 0 && dx > 0;
  const atEnd = lightboxState.index === lightboxState.items.length - 1 && dx < 0;
  const resisted = atStart || atEnd ? dx * 0.24 : dx;
  document.getElementById('lightbox').style.setProperty('--viewer-dx', `${resisted}px`);
}

function setLightboxEdgeBackDrag(dx) {
  const lightbox = document.getElementById('lightbox');
  const resisted = Math.max(0, dx);
  const progress = Math.min(resisted / Math.max(180, innerWidth * 0.72), 1);
  lightbox.style.setProperty('--viewer-shell-x', `${resisted}px`);
  lightbox.style.setProperty('--viewer-scale', String(1 - progress * 0.025));
  lightbox.style.setProperty('--viewer-content-opacity', String(1 - progress * 0.18));
  lightbox.style.setProperty('--viewer-bg-alpha', String(0.56 - progress * 0.5));
}

function setLightboxVerticalDrag(dy) {
  const lightbox = document.getElementById('lightbox');
  const progress = Math.min(Math.abs(dy) / Math.max(180, innerHeight * 0.42), 1);
  if (lightboxState.context === 'material-grid') {
    const direction = dy < 0 ? 1 : -1;
    const canNavigate = lightboxState.sequenceIndex + direction >= 0
      && lightboxState.sequenceIndex + direction < lightboxState.sequenceLength;
    lightbox.style.setProperty('--viewer-y', `${canNavigate ? dy : dy * 0.24}px`);
    lightbox.style.setProperty('--viewer-scale', '1');
    lightbox.style.setProperty('--viewer-content-opacity', String(1 - progress * 0.12));
    lightbox.style.setProperty('--viewer-bg-alpha', '0.56');
    return;
  }
  lightbox.style.setProperty('--viewer-y', `${dy}px`);
  lightbox.style.setProperty('--viewer-scale', String(1 - progress * 0.06));
  lightbox.style.setProperty('--viewer-content-opacity', String(1 - progress * 0.2));
  lightbox.style.setProperty('--viewer-bg-alpha', String(0.56 - progress * 0.48));
}

function openLightbox(items, index = 0, options = {}) {
  const normalized = normalizeViewerItems(items);
  if (!normalized.length) return;
  const lightbox = document.getElementById('lightbox');
  window.clearTimeout(lightboxState.closeTimer);
  window.clearTimeout(lightboxState.sequenceTimer);
  lightboxState.items = normalized;
  lightboxState.index = Math.max(0, Math.min(index, normalized.length - 1));
  lightboxState.context = options.context || 'default';
  lightboxState.sequenceIndex = Number.isFinite(options.sequenceIndex) ? options.sequenceIndex : -1;
  lightboxState.sequenceLength = Number.isFinite(options.sequenceLength) ? options.sequenceLength : 0;
  lightboxState.source = options.source || null;
  lightboxState.audioMuted = false;
  lightboxState.switching = false;
  lightboxState.lastFocused = document.activeElement;
  lightbox.dataset.context = lightboxState.context;
  resetLightboxDrag();
  renderLightboxItems();
  renderLightboxSource();
  updateLightboxUnlikeControl();
  setLightboxIndex(lightboxState.index, false);
  lightbox.classList.add('open');
  lightbox.setAttribute('aria-hidden', 'false');
  syncPageScrollLock();
  requestAnimationFrame(fitLightboxMedia);
  document.querySelector('.lightbox-close').focus({ preventScroll: true });
}

function finalizeLightboxClose() {
  const lightbox = document.getElementById('lightbox');
  window.clearTimeout(lightboxState.sequenceTimer);
  document.querySelectorAll('#lightboxTrack video').forEach(video => video.pause());
  lightbox.classList.remove('open', 'dragging', 'dismissing', 'sequence-leaving', 'sequence-reset', 'sequence-entering');
  lightbox.setAttribute('aria-hidden', 'true');
  delete lightbox.dataset.context;
  document.getElementById('lightboxTrack').replaceChildren();
  document.getElementById('lightboxThumbs').replaceChildren();
  lightboxState.items = [];
  lightboxState.context = 'default';
  lightboxState.sequenceIndex = -1;
  lightboxState.sequenceLength = 0;
  lightboxState.source = null;
  lightboxState.audioMuted = false;
  lightboxState.switching = false;
  lightboxGesture.pointerId = null;
  document.getElementById('lightboxSource').hidden = true;
  document.getElementById('lightboxUnlike').hidden = true;
  document.getElementById('lightboxSound').hidden = true;
  lightbox.style.setProperty('--viewer-backdrop', 'none');
  resetLightboxDrag();
  syncPageScrollLock();
  if (lightboxState.lastFocused?.isConnected) {
    lightboxState.lastFocused.focus({ preventScroll: true });
  }
  lightboxState.lastFocused = null;
}

function closeLightbox() {
  const lightbox = document.getElementById('lightbox');
  if (!lightbox.classList.contains('open') || lightbox.classList.contains('dismissing')) return;
  window.clearTimeout(lightboxState.sequenceTimer);
  lightboxState.switching = false;
  resetLightboxDrag();
  lightbox.classList.add('dismissing');
  const delay = matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 200;
  lightboxState.closeTimer = window.setTimeout(finalizeLightboxClose, delay);
}

function dismissLightboxVertical(dy) {
  const lightbox = document.getElementById('lightbox');
  const direction = dy < 0 ? -1 : 1;
  lightbox.classList.remove('dragging');
  lightbox.classList.add('dismissing');
  lightbox.style.setProperty('--viewer-y', `${direction * Math.max(innerHeight * 0.82, 520)}px`);
  lightbox.style.setProperty('--viewer-scale', '0.94');
  lightbox.style.setProperty('--viewer-content-opacity', '0');
  lightbox.style.setProperty('--viewer-bg-alpha', '0');
  const delay = matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 200;
  lightboxState.closeTimer = window.setTimeout(finalizeLightboxClose, delay);
}

function dismissLightboxEdgeBack() {
  const lightbox = document.getElementById('lightbox');
  lightbox.classList.remove('dragging');
  lightbox.classList.add('dismissing');
  lightbox.style.setProperty('--viewer-shell-x', `${Math.max(innerWidth, 520)}px`);
  lightbox.style.setProperty('--viewer-scale', '0.97');
  lightbox.style.setProperty('--viewer-content-opacity', '0');
  lightbox.style.setProperty('--viewer-bg-alpha', '0');
  const delay = matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 200;
  lightboxState.closeTimer = window.setTimeout(finalizeLightboxClose, delay);
}

function openLightboxSourcePost() {
  const source = lightboxState.source;
  if (!source?.tweet || !Array.isArray(source.collection)) return;
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const delay = reducedMotion ? 0 : 220;
  const collection = source.collection;
  const key = getMaterialPostKey(source.tweet);
  const preferredIndex = source.index;
  closeLightbox();
  window.setTimeout(() => {
    const index = getMaterialPostKey(collection[preferredIndex] || {}) === key
      ? preferredIndex
      : collection.findIndex(tweet => getMaterialPostKey(tweet) === key);
    if (index >= 0) openModalAt(index, collection);
  }, delay);
}

function trapLightboxFocus(event) {
  if (event.key !== 'Tab') return false;
  const lightbox = document.getElementById('lightbox');
  const focusable = [...lightbox.querySelectorAll('button:not([hidden]):not(:disabled), [tabindex="0"]')]
    .filter(element => element.getClientRects().length > 0 && element.getAttribute('aria-hidden') !== 'true');
  if (!focusable.length) return false;
  const first = focusable[0];
  const last = focusable[focusable.length - 1];
  if (event.shiftKey && document.activeElement === first) {
    event.preventDefault();
    last.focus();
    return true;
  }
  if (!event.shiftKey && document.activeElement === last) {
    event.preventDefault();
    first.focus();
    return true;
  }
  return false;
}

function applyMaterialGridSequenceIndex(sequenceIndex) {
  const entry = materialGridItems[sequenceIndex];
  if (!entry) return false;
  const payload = getMaterialViewerPayload(entry);
  const normalized = normalizeViewerItems(payload.items);
  if (!normalized.length) return false;
  lightboxState.sequenceIndex = sequenceIndex;
  lightboxState.items = normalized;
  lightboxState.index = Math.max(0, Math.min(payload.index, normalized.length - 1));
  lightboxState.source = payload.source;
  renderLightboxItems();
  renderLightboxSource();
  updateLightboxUnlikeControl();
  setLightboxIndex(lightboxState.index, false);
  return true;
}

function switchLightboxSequence(direction) {
  if (lightboxState.context !== 'material-grid' || lightboxState.switching) return;
  const nextSequenceIndex = lightboxState.sequenceIndex + direction;
  if (nextSequenceIndex < 0 || nextSequenceIndex >= lightboxState.sequenceLength) {
    resetLightboxDrag();
    return;
  }

  const lightbox = document.getElementById('lightbox');
  const travel = Math.max(innerHeight, 520);
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const leaveDuration = reducedMotion ? 0 : 200;
  const enterDuration = reducedMotion ? 0 : 300;
  lightboxState.switching = true;
  document.querySelectorAll('#lightboxTrack video').forEach(video => video.pause());
  lightbox.classList.remove('dragging');
  lightbox.classList.add('sequence-leaving');
  lightbox.style.setProperty('--viewer-y', `${direction > 0 ? -travel : travel}px`);
  lightbox.style.setProperty('--viewer-content-opacity', '0');

  lightboxState.sequenceTimer = window.setTimeout(() => {
    lightbox.classList.remove('sequence-leaving');
    lightbox.classList.add('sequence-reset');
    if (!applyMaterialGridSequenceIndex(nextSequenceIndex)) {
      lightboxState.switching = false;
      resetLightboxDrag();
      return;
    }
    lightbox.style.setProperty('--viewer-y', `${direction > 0 ? travel : -travel}px`);
    lightbox.style.setProperty('--viewer-content-opacity', '0');
    void document.querySelector('.lightbox-shell').offsetWidth;
    requestAnimationFrame(() => {
      if (!lightbox.classList.contains('open') || lightboxState.context !== 'material-grid') return;
      lightbox.classList.remove('sequence-reset');
      lightbox.classList.add('sequence-entering');
      lightbox.style.setProperty('--viewer-y', '0px');
      lightbox.style.setProperty('--viewer-content-opacity', '1');
      lightboxState.sequenceTimer = window.setTimeout(() => {
        lightbox.classList.remove('sequence-entering');
        lightboxState.switching = false;
      }, enterDuration);
    });
  }, leaveDuration);
}

function navigateLightbox(direction) {
  setLightboxIndex(lightboxState.index + direction);
}

function onLightboxPointerDown(event) {
  const lightbox = document.getElementById('lightbox');
  const edgeBack = innerWidth <= 767 && event.clientX <= 28;
  const interactive = event.target.closest('.lightbox-footer, .lightbox-nav, .lightbox-thumbs');
  if (!lightbox.classList.contains('open') || lightboxState.switching || event.button !== 0 || (interactive && !edgeBack)) return;
  lightboxGesture.pointerId = event.pointerId;
  lightboxGesture.startX = event.clientX;
  lightboxGesture.startY = event.clientY;
  lightboxGesture.startTime = performance.now();
  lightboxGesture.dx = 0;
  lightboxGesture.dy = 0;
  lightboxGesture.axis = null;
  lightboxGesture.didDrag = false;
  lightboxGesture.edgeBack = edgeBack;
}

function onLightboxPointerMove(event) {
  if (event.pointerId !== lightboxGesture.pointerId) return;
  lightboxGesture.dx = event.clientX - lightboxGesture.startX;
  lightboxGesture.dy = event.clientY - lightboxGesture.startY;
  const absX = Math.abs(lightboxGesture.dx);
  const absY = Math.abs(lightboxGesture.dy);
  if (!lightboxGesture.axis && Math.max(absX, absY) > 8) {
    if (lightboxGesture.edgeBack && lightboxGesture.dx > 0 && absX > absY * 1.05) {
      lightboxGesture.axis = 'edge-back';
    } else {
      lightboxGesture.axis = absX > absY ? 'x' : 'y';
    }
    lightboxGesture.didDrag = true;
    const lightbox = document.getElementById('lightbox');
    lightbox.setPointerCapture(event.pointerId);
    lightbox.classList.add('dragging');
  }
  if (lightboxGesture.axis === 'edge-back') setLightboxEdgeBackDrag(lightboxGesture.dx);
  if (lightboxGesture.axis === 'x') setLightboxHorizontalDrag(lightboxGesture.dx);
  if (lightboxGesture.axis === 'y') setLightboxVerticalDrag(lightboxGesture.dy);
  if (lightboxGesture.axis) event.preventDefault();
}

function onLightboxPointerEnd(event) {
  if (event.pointerId !== lightboxGesture.pointerId) return;
  const lightbox = document.getElementById('lightbox');
  const elapsed = Math.max(performance.now() - lightboxGesture.startTime, 1);
  if (lightbox.hasPointerCapture(event.pointerId)) lightbox.releasePointerCapture(event.pointerId);
  lightboxGesture.pointerId = null;

  if (lightboxGesture.axis === 'edge-back') {
    const distance = Math.max(0, lightboxGesture.dx);
    const velocity = distance / elapsed;
    const threshold = Math.min(132, Math.max(72, innerWidth * 0.22));
    lightbox.classList.remove('dragging');
    if (distance >= threshold || (distance >= 32 && velocity >= 0.48)) {
      dismissLightboxEdgeBack();
    } else {
      resetLightboxDrag();
    }
    return;
  }

  if (lightboxGesture.axis === 'x') {
    const distance = Math.abs(lightboxGesture.dx);
    const velocity = distance / elapsed;
    const threshold = Math.min(120, Math.max(64, innerWidth * 0.18));
    const direction = lightboxGesture.dx < 0 ? 1 : -1;
    const canNavigate = lightboxState.index + direction >= 0
      && lightboxState.index + direction < lightboxState.items.length;
    lightbox.classList.remove('dragging');
    if (canNavigate && (distance >= threshold || (distance >= 28 && velocity >= 0.48))) {
      setLightboxIndex(lightboxState.index + direction);
    } else {
      resetLightboxDrag();
    }
    return;
  }

  if (lightboxGesture.axis === 'y') {
    const distance = Math.abs(lightboxGesture.dy);
    const velocity = distance / elapsed;
    const threshold = Math.min(120, Math.max(72, innerHeight * 0.11));
    if (lightboxState.context === 'material-grid') {
      const direction = lightboxGesture.dy < 0 ? 1 : -1;
      const canNavigate = lightboxState.sequenceIndex + direction >= 0
        && lightboxState.sequenceIndex + direction < lightboxState.sequenceLength;
      lightbox.classList.remove('dragging');
      if (canNavigate && (distance >= threshold || (distance >= 32 && velocity >= 0.52))) {
        switchLightboxSequence(direction);
      } else {
        resetLightboxDrag();
      }
      return;
    }
    if (distance >= threshold || (distance >= 32 && velocity >= 0.52)) {
      dismissLightboxVertical(lightboxGesture.dy);
    } else {
      resetLightboxDrag();
    }
    return;
  }

  resetLightboxDrag();
}

function syncFilterControls() {
  document.getElementById('searchInput').value = searchQuery;
  document.querySelectorAll('#typeTags .filter-tag').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.filter === currentFilter);
  });
  document.querySelectorAll('#sourceTags .filter-tag').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.source === currentSource);
  });
  renderTagFilterRow();
}

function saveCurrentSearchState() {
  if (activeTab !== 'search') return;
  searchState = {
    query: searchQuery,
    filter: currentFilter,
    source: currentSource,
    tags: [...currentTags]
  };
}

function setCollectionState(state) {
  searchQuery = state.query;
  currentFilter = state.filter;
  currentSource = state.source;
  currentTags = [...state.tags];
  syncFilterControls();
  applyFilters();
}

function setActiveTab(tab, updateHash = true) {
  if (!['home', 'likes', 'search', 'media'].includes(tab)) tab = 'home';
  saveCurrentSearchState();
  if (activeTab === 'media' && tab !== 'media') pauseMaterialBrowser();
  activeTab = tab;

  document.querySelectorAll('.app-view').forEach(view => {
    view.classList.toggle('active', view.dataset.view === tab);
  });
  document.querySelectorAll('.tab-button').forEach(btn => {
    const active = btn.dataset.tab === tab;
    btn.classList.toggle('active', active);
    if (active) btn.setAttribute('aria-current', 'page');
    else btn.removeAttribute('aria-current');
  });

  closeModal();
  closeLightbox();

  const surface = document.getElementById('collectionSurface');
  if (tab === 'likes') {
    document.getElementById('likesMount').appendChild(surface);
    setCollectionState({ query: '', filter: 'all', source: 'all', tags: [] });
  } else if (tab === 'search') {
    document.getElementById('searchMount').appendChild(surface);
    setCollectionState(searchState);
  } else if (tab === 'media') {
    cleanupCardVideos(document.getElementById('masonry'));
    renderMaterialBrowser();
  } else {
    cleanupCardVideos(document.getElementById('masonry'));
  }

  window.scrollTo({ top: 0, behavior: 'auto' });
  if (updateHash) history.replaceState(null, '', `#${tab}`);
}

document.getElementById('modalClose').addEventListener('click', closeModal);
document.getElementById('modalPrev').addEventListener('click', (e) => { e.stopPropagation(); navigateModal(-1); });
document.getElementById('modalNext').addEventListener('click', (e) => { e.stopPropagation(); navigateModal(1); });
document.getElementById('modalBackdrop').addEventListener('click', (e) => {

});
const lightboxElement = document.getElementById('lightbox');
lightboxElement.addEventListener('pointerdown', onLightboxPointerDown);
lightboxElement.addEventListener('pointermove', onLightboxPointerMove);

lightboxElement.addEventListener('pointercancel', onLightboxPointerEnd);
document.querySelector('.lightbox-close').addEventListener('click', closeLightbox);
document.getElementById('lightboxSound').addEventListener('click', toggleLightboxSound);
document.getElementById('lightboxUnlike').addEventListener('click', event => {
  event.stopPropagation();
  permanentlyUnlikeTweet(lightboxState.source?.tweet);
});
document.getElementById('lightboxSource').addEventListener('click', openLightboxSourcePost);
document.getElementById('lightboxSound').addEventListener('keydown', event => {
  if (event.key !== 'Enter' && event.key !== ' ') return;
  event.preventDefault();
  toggleLightboxSound();
});
document.getElementById('lightboxSource').addEventListener('keydown', event => {
  if (event.key !== 'Enter' && event.key !== ' ') return;
  event.preventDefault();
  openLightboxSourcePost();
});
document.getElementById('lightboxPrev').addEventListener('click', () => navigateLightbox(-1));
document.getElementById('lightboxNext').addEventListener('click', () => navigateLightbox(1));

document.addEventListener('keydown', (e) => {
  if (document.getElementById('lightbox').classList.contains('open')) {
    if (trapLightboxFocus(e)) return;
    if (e.key === 'Escape') closeLightbox();
    else if (e.key === 'ArrowLeft') navigateLightbox(-1);
    else if (e.key === 'ArrowRight') navigateLightbox(1);
    else if (e.key === 'ArrowUp' && lightboxState.context === 'material-grid') switchLightboxSequence(1);
    else if (e.key === 'ArrowDown' && lightboxState.context === 'material-grid') switchLightboxSequence(-1);
    else if (e.key.toLowerCase() === 'm') toggleLightboxSound();
    return;
  }
  if (!document.getElementById('modalBackdrop').classList.contains('open')) return;
  if (e.key === 'Escape') closeModal();
  else if (e.key === 'ArrowLeft') navigateModal(-1);
  else if (e.key === 'ArrowRight') navigateModal(1);
});

window.addEventListener('scroll', function onScroll() {
  const st = document.getElementById('scrollTop');
  if (window.scrollY > 600) st.classList.add('visible');
  else st.classList.remove('visible');

    renderMaterialGridBatch();
  } else if (activeTab === 'likes' || activeTab === 'search') {

}, { passive: true });

['dragenter', 'dragover'].forEach(ev => {

});

// ── Init: load from localStorage, then load all CSV files listed in csv-list.json ──
(async function init() {
  allTweets = loadFromStorage();

  try {
    const listResp = await fetch('csv-list.json', { cache: 'no-cache' });
    const csvFiles = listResp.ok ? await listResp.json() : [];

    const texts = await Promise.all(
      csvFiles.map(name =>
        fetch(name).then(r => r.ok ? r.text() : '').catch(() => '')
      )
    );

    const csvTweets = texts.flatMap((text, i) => {
      const source = guessSource(csvFiles[i]);
      return importCSVText(text, source);
    });

    if (csvTweets.length > 0) {
      const { merged, added } = mergeTweets(allTweets, csvTweets);
      allTweets = merged;
      if (added > 0) saveToStorage();
    }
  } catch (e) { /* CSV files not available, that's fine */ }

  refreshLikedTweetIds();
  hydrateTags();
  saveTagsMap();
  renderTagFilterRow();

  document.getElementById('countDisplay').textContent = allTweets.length;
  filteredTweets = allTweets;
  updateDataBar();
  renderHomeFeed();
  const requestedTab = location.hash.replace('#', '');
  setActiveTab(['home', 'likes', 'search', 'media'].includes(requestedTab) ? requestedTab : 'home', false);
  document.body.dataset.collectionReady = 'true';
  document.dispatchEvent(new Event('collection:ready'));
})();
</script>
<script type="module">
  import { LiquidGlass } from 'https://cdn.jsdelivr.net/npm/@ybouane/liquidglass@1.0.3/dist/index.js';

  const glassStage = document.querySelector('.liquid-glass-stage');
  const sceneCanvas = document.querySelector('.liquid-glass-scene');
  const nav = document.querySelector('.bottom-tab-bar');
  if (glassStage && sceneCanvas && nav) {
    if (document.body.dataset.collectionReady !== 'true') {
      await new Promise(resolve => document.addEventListener('collection:ready', resolve, { once: true }));
    }

    nav.dataset.config = JSON.stringify({
      blurAmount: 0.16,
      refraction: 0.72,
      chromAberration: 0.035,
      edgeHighlight: 0.12,
      specular: 0.16,
      fresnel: 0.88,
      distortion: 0.008,
      cornerRadius: 32,
      zRadius: 24,
      opacity: 0.96,
      saturation: -0.08,
      tintStrength: 0.035,
      brightness: -0.04,
      shadowOpacity: 0.22,
      shadowSpread: 8,
      shadowOffsetY: 2,
      floating: false,
      button: false
    });

    let liquidGlassInstance = null;
    let paintFrame = 0;

    const intersects = (a, b) => (
      a.right > b.left && a.left < b.right && a.bottom > b.top && a.top < b.bottom
    );

    const paintNavScene = () => {
      paintFrame = 0;
      const sceneRect = sceneCanvas.getBoundingClientRect();
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const width = Math.max(1, Math.round(sceneRect.width * dpr));
      const height = Math.max(1, Math.round(sceneRect.height * dpr));
      if (sceneCanvas.width !== width || sceneCanvas.height !== height) {
        sceneCanvas.width = width;
        sceneCanvas.height = height;
      }

      const ctx = sceneCanvas.getContext('2d');
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, sceneRect.width, sceneRect.height);
      ctx.fillStyle = getComputedStyle(document.body).backgroundColor || '#080808';
      ctx.fillRect(0, 0, sceneRect.width, sceneRect.height);

      const sampled = new Set();
      const columns = 8;
      const rows = 3;
      for (let row = 0; row < rows; row += 1) {
        for (let column = 0; column < columns; column += 1) {
          const x = sceneRect.left + ((column + 0.5) / columns) * sceneRect.width;
          const y = sceneRect.top + ((row + 0.5) / rows) * sceneRect.height;
          document.elementsFromPoint(x, y).forEach(element => {
            if (glassStage.contains(element) || element === document.body || element === document.documentElement) return;
            let current = element;
            while (current && current !== document.body) {
              if (!glassStage.contains(current)) sampled.add(current);
              current = current.parentElement;
            }
          });
        }
      }

      const elements = [...sampled].filter(element => {
        const rect = element.getBoundingClientRect();
        const style = getComputedStyle(element);
        return intersects(rect, sceneRect)
          && style.display !== 'none'
          && style.visibility !== 'hidden'
          && Number.parseFloat(style.opacity || '1') > 0;
      }).sort((a, b) => {
        if (a.contains(b)) return -1;
        if (b.contains(a)) return 1;
        return a.compareDocumentPosition(b) & Node.DOCUMENT_POSITION_FOLLOWING ? -1 : 1;
      });

      const localRect = rect => ({
        x: rect.left - sceneRect.left,
        y: rect.top - sceneRect.top,
        width: rect.width,
        height: rect.height
      });

      elements.forEach(element => {
        const rect = element.getBoundingClientRect();
        const local = localRect(rect);
        const style = getComputedStyle(element);
        const radius = Math.min(Number.parseFloat(style.borderTopLeftRadius) || 0, local.width / 2, local.height / 2);
        const background = style.backgroundColor;
        const isMedia = element instanceof HTMLImageElement
          || element instanceof HTMLVideoElement
          || element instanceof HTMLCanvasElement;

        if (background && background !== 'rgba(0, 0, 0, 0)' && background !== 'transparent') {
          ctx.save();
          ctx.globalAlpha = Number.parseFloat(style.opacity || '1');
          ctx.fillStyle = background;
          ctx.beginPath();
          ctx.roundRect(local.x, local.y, local.width, local.height, radius);
          ctx.fill();
          ctx.restore();
        }

        if (isMedia && element !== sceneCanvas) {
          const sourceWidth = element instanceof HTMLImageElement
            ? element.naturalWidth
            : element instanceof HTMLVideoElement
              ? element.videoWidth
              : element.width;
          const sourceHeight = element instanceof HTMLImageElement
            ? element.naturalHeight
            : element instanceof HTMLVideoElement
              ? element.videoHeight
              : element.height;
          if (sourceWidth > 0 && sourceHeight > 0) {
            const fit = style.objectFit || 'fill';
            const scale = fit === 'cover'
              ? Math.max(local.width / sourceWidth, local.height / sourceHeight)
              : fit === 'contain'
                ? Math.min(local.width / sourceWidth, local.height / sourceHeight)
                : null;
            const drawWidth = scale ? sourceWidth * scale : local.width;
            const drawHeight = scale ? sourceHeight * scale : local.height;
            ctx.save();
            ctx.beginPath();
            ctx.roundRect(local.x, local.y, local.width, local.height, radius);
            ctx.clip();
            try {
              ctx.drawImage(
                element,
                local.x + (local.width - drawWidth) / 2,
                local.y + (local.height - drawHeight) / 2,
                drawWidth,
                drawHeight
              );
            } catch (_) { /* Cross-origin media keeps the sampled background color. */ }
            ctx.restore();
          }
        }

        [...element.childNodes].forEach(node => {
          if (node.nodeType !== Node.TEXT_NODE || !node.textContent.trim()) return;
          const range = document.createRange();
          range.selectNodeContents(node);
          const textRect = range.getBoundingClientRect();
          if (!intersects(textRect, sceneRect) || textRect.width < 1 || textRect.height < 1) return;
          const textLocal = localRect(textRect);
          ctx.save();
          ctx.beginPath();
          ctx.rect(textLocal.x, textLocal.y, textLocal.width, textLocal.height);
          ctx.clip();
          ctx.fillStyle = style.color;
          ctx.globalAlpha = Math.min(0.9, Number.parseFloat(style.opacity || '1'));
          ctx.font = `${style.fontWeight} ${style.fontSize} ${style.fontFamily}`;
          ctx.textBaseline = 'alphabetic';
          ctx.fillText(node.textContent.trim(), textLocal.x, textLocal.y + textLocal.height * 0.82);
          ctx.restore();
        });
      });

      liquidGlassInstance?.markChanged(sceneCanvas);
    };

    const requestScenePaint = () => {
      if (!paintFrame) paintFrame = requestAnimationFrame(paintNavScene);
    };

    try {
      await document.fonts.ready;
      paintNavScene();
      const instance = await LiquidGlass.init({
        root: glassStage,
        glassElements: [nav]
      });
      liquidGlassInstance = instance;
      window.__liquidGlassNav = instance;
      nav.dataset.renderer = 'webgl-refraction';
      nav.classList.add('shader-ready');
      window.addEventListener('scroll', requestScenePaint, { passive: true });
      window.addEventListener('resize', requestScenePaint, { passive: true });
      window.addEventListener('hashchange', () => setTimeout(requestScenePaint, 0));
      document.addEventListener('click', event => {
        if (event.target.closest('.tab-button')) setTimeout(requestScenePaint, 0);
      });
      requestScenePaint();
    } catch (error) {
      nav.dataset.renderer = 'css-fallback';
      nav.classList.add('shader-fallback');
      console.warn('Liquid Glass WebGL fallback:', error);
    }
  }
</script>
